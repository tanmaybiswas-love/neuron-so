<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat — Puter.js</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --surface-hover: #252525;
            --border: #2a2a2a;
            --text: #e8e8e8;
            --text-secondary: #a0a0a0;
            --text-tertiary: #666;
            --accent: #d4a574;
            --accent-soft: rgba(212, 165, 116, 0.12);
            --user-bg: #2d2d2d;
            --bot-bg: #1a1a1a;
            --radius: 14px;
            --radius-sm: 10px;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --danger: #ef4444;
            --warning: #facc15;
            --success: #4ade80;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Bengali", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .logo {
            width: 34px; height: 34px;
            background: linear-gradient(135deg, #d4a574, #b8895e);
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .header-title { font-size: 15px; font-weight: 600; }
        .header-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }

        .model-select {
            padding: 5px 10px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }

        .status {
            display: flex; align-items: center; gap: 5px;
            font-size: 11px; color: var(--text-tertiary);
        }
        .status-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--text-tertiary);
            transition: background 0.3s;
        }
        .status-dot.ready { background: var(--success); box-shadow: 0 0 5px rgba(74,222,128,0.4); }
        .status-dot.loading { background: var(--warning); animation: pulse 1.2s infinite; }
        .status-dot.error { background: var(--danger); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* Debug Panel */
        .debug-panel {
            background: #111;
            border-bottom: 1px solid var(--border);
            padding: 8px 16px;
            font-size: 11px;
            font-family: "SF Mono", "Fira Code", monospace;
            color: var(--text-tertiary);
            max-height: 80px;
            overflow-y: auto;
            display: none;
        }
        .debug-panel.show { display: block; }
        .debug-line { margin: 2px 0; }
        .debug-line.error { color: var(--danger); }
        .debug-line.warn { color: var(--warning); }
        .debug-line.info { color: var(--success); }

        /* Chat */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }
        .chat-container::-webkit-scrollbar { width: 5px; }
        .chat-container::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .message {
            display: flex;
            gap: 10px;
            max-width: 92%;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.bot { align-self: flex-start; }

        .avatar {
            width: 30px; height: 30px;
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; flex-shrink: 0;
        }
        .avatar.user { background: #3a3a3a; }
        .avatar.bot { background: var(--accent-soft); border: 1px solid rgba(212,165,116,0.2); }

        .bubble {
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .bubble.user {
            background: var(--user-bg);
            border-bottom-right-radius: 4px;
        }
        .bubble.bot {
            background: var(--bot-bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .bubble code {
            background: #2a2a2a;
            padding: 2px 5px;
            border-radius: 4px;
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 12px;
        }
        .bubble pre {
            background: #151515;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .bubble pre code { background: transparent; padding: 0; font-size: 12px; }
        .bubble strong { color: var(--accent); }

        /* Typing */
        .typing {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--bot-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            border-bottom-left-radius: 4px;
            width: fit-content;
            margin-left: 40px;
        }
        .typing.active { display: flex; }
        .typing-dots { display: flex; gap: 3px; }
        .typing-dots span {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--text-tertiary);
            animation: bounce 1.3s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(1) { animation-delay: -0.3s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.15s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.5); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Input */
        .input-area {
            padding: 12px 16px 16px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }
        .input-box {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 12px;
        }
        .input-box:focus-within { border-color: var(--accent); }
        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            max-height: 100px;
            font-family: inherit;
            padding: 4px 0;
        }
        .input-box textarea::placeholder { color: var(--text-tertiary); }
        .send-btn {
            width: 34px; height: 34px;
            border-radius: var(--radius-sm);
            background: var(--accent);
            border: none;
            color: #1a1a1a;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .send-btn:active { transform: scale(0.92); }
        .send-btn:disabled { opacity: 0.35; }

        /* Empty State */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: var(--text-tertiary);
            text-align: center;
            padding: 30px;
        }
        .empty-state .logo-big {
            width: 56px; height: 56px;
            background: var(--accent-soft);
            border-radius: var(--radius);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
            border: 1px solid rgba(212,165,116,0.15);
        }
        .empty-state h3 { color: var(--text); font-size: 17px; font-weight: 500; }
        .empty-state p { font-size: 13px; max-width: 300px; line-height: 1.6; }
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 6px;
        }
        .suggestion-chip {
            padding: 7px 12px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
        }
        .suggestion-chip:active { background: var(--accent-soft); border-color: var(--accent); }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--text-secondary);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: var(--shadow);
            max-width: 90vw;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Connection test btn */
        .test-btn {
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-tertiary);
            font-size: 11px;
            cursor: pointer;
            margin-left: 8px;
        }
        .test-btn:active { background: var(--surface-hover); }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo">🤖</div>
            <div>
                <div class="header-title">AI Chat</div>
                <div class="header-sub">Puter.js — No API key</div>
            </div>
        </div>
        <div style="display: flex; align-items: center;">
            <select class="model-select" id="modelSelect">
                <option value="claude-sonnet-5">Claude Sonnet 5</option>
                <option value="claude-opus-5">Claude Opus 5</option>
                <option value="claude-fable-5">Claude Fable 5</option>
                <option value="qwen3.8-max">Qwen3.8 Max</option>
                <option value="qwen3-coder-plus">Qwen3 Coder Plus</option>
                <option value="gpt-5.6-luna">GPT-5.6 Luna</option>
                <option value="gpt-oss-120b">GPT-OSS 120B</option>
                <option value="gemini-3-flash">Gemini 3 Flash</option>
            </select>
            <button class="test-btn" id="testBtn">Test</button>
        </div>
    </div>

    <div class="status" style="padding: 6px 16px; background: var(--surface); border-bottom: 1px solid var(--border);">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Loading...</span>
    </div>

    <div class="debug-panel" id="debugPanel">
        <div class="debug-line">Debug console ready...</div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="empty-state" id="emptyState">
            <div class="logo-big">💬</div>
            <h3>AI Chat শুরু করুন</h3>
            <p>Claude, Qwen, GPT এবং আরও ৫০০+ মডেলের সাথে কথা বলুন। কোনো API key লাগে না!</p>
            <div class="suggestions">
                <button class="suggestion-chip" onclick="setInput('বাংলায় একটি ছোট গল্প লিখো')">✍️ গল্প</button>
                <button class="suggestion-chip" onclick="setInput('JavaScript To-Do app code দাও')">💻 Code</button>
                <button class="suggestion-chip" onclick="setInput('বাংলাদেশের ইতিহাস বলো')">📚 ইতিহাস</button>
                <button class="suggestion-chip" onclick="setInput('আজকের আবহাওয়া কেমন?')">🌤️ আবহাওয়া</button>
            </div>
        </div>
    </div>

    <div class="typing" id="typingIndicator">
        <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>

    <div class="input-area">
        <div class="input-box">
            <textarea id="messageInput" rows="1" placeholder="মেসেজ লিখুন..."></textarea>
            <button class="send-btn" id="sendBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://js.puter.com/v2/"></script>
    <script>
        // ===== Debug Logger =====
        const debugPanel = document.getElementById('debugPanel');
        const debugLines = [];
        function log(msg, type) {
            const line = document.createElement('div');
            line.className = 'debug-line ' + (type || 'info');
            line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            debugPanel.appendChild(line);
            debugPanel.classList.add('show');
            debugPanel.scrollTop = debugPanel.scrollHeight;
            console.log('[AI Chat]', msg);
        }

        // ===== Elements =====
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const modelSelect = document.getElementById('modelSelect');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const typingIndicator = document.getElementById('typingIndicator');
        const emptyState = document.getElementById('emptyState');
        const toast = document.getElementById('toast');
        const testBtn = document.getElementById('testBtn');

        let messages = [];
        let isLoading = false;
        let puterReady = false;

        // ===== Status =====
        function setStatus(state, text) {
            statusDot.className = 'status-dot ' + state;
            statusText.textContent = text;
            log('Status: ' + text, state === 'error' ? 'error' : 'info');
        }

        // ===== Toast =====
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ===== Input =====
        function setInput(text) {
            messageInput.value = text;
            messageInput.focus();
            autoResize();
        }

        function autoResize() {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
        }

        messageInput.addEventListener('input', autoResize);
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // ===== Send Button (click + touch) =====
        function handleSend(e) {
            e.preventDefault();
            e.stopPropagation();
            sendMessage();
        }
        sendBtn.addEventListener('click', handleSend);
        sendBtn.addEventListener('touchend', function(e) {
            e.preventDefault();
            handleSend(e);
        });

        // ===== Test Connection =====
        testBtn.addEventListener('click', async function() {
            log('Testing Puter.js connection...', 'warn');
            if (typeof puter === 'undefined') {
                setStatus('error', 'Puter.js not loaded');
                showToast('Puter.js লোড হয়নি!');
                return;
            }
            try {
                log('puter object found: ' + typeof puter, 'info');
                log('puter.ai: ' + typeof puter.ai, 'info');
                log('puter.ai.chat: ' + typeof puter.ai.chat, 'info');
                showToast('Puter.js loaded! ai.chat: ' + typeof puter.ai.chat);
                puterReady = true;
                setStatus('ready', 'Ready');
            } catch (err) {
                log('Test error: ' + err.message, 'error');
                setStatus('error', 'Test failed');
            }
        });

        // ===== Create Message =====
        function createMessage(role, content) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            const avatar = document.createElement('div');
            avatar.className = 'avatar ' + role;
            avatar.textContent = role === 'user' ? '👤' : '🤖';
            const bubble = document.createElement('div');
            bubble.className = 'bubble ' + role;
            bubble.innerHTML = formatContent(content);
            div.appendChild(avatar);
            div.appendChild(bubble);
            return { div, bubble };
        }

        // ===== Format Content =====
        function formatContent(text) {
            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            html = html.replace(/```([\w]*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        // ===== Send Message =====
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) { log('Empty message, ignoring', 'warn'); return; }
            if (isLoading) { log('Already loading, ignoring', 'warn'); return; }
            if (typeof puter === 'undefined') {
                setStatus('error', 'Puter.js not loaded');
                showToast('Puter.js লোড হয়নি! Page refresh করুন।');
                return;
            }

            log('Sending: "' + text.substring(0, 30) + '..."', 'info');

            if (emptyState) emptyState.style.display = 'none';

            const userMsg = createMessage('user', text);
            chatContainer.appendChild(userMsg.div);
            scrollToBottom();
            messages.push({ role: 'user', content: text });

            messageInput.value = '';
            messageInput.style.height = 'auto';

            isLoading = true;
            sendBtn.disabled = true;
            setStatus('loading', 'Thinking...');
            typingIndicator.classList.add('active');
            scrollToBottom();

            try {
                const model = modelSelect.value;
                log('Model: ' + model, 'info');

                const resp = await puter.ai.chat(messages, { model: model, stream: true });
                log('Response received, type: ' + typeof resp, 'info');

                typingIndicator.classList.remove('active');
                const botMsg = createMessage('bot', '');
                chatContainer.appendChild(botMsg.div);

                let fullText = '';
                let chunkCount = 0;

                if (resp && typeof resp[Symbol.asyncIterator] === 'function') {
                    log('Streaming started...', 'info');
                    for await (const part of resp) {
                        chunkCount++;
                        if (part && part.text) {
                            fullText += part.text;
                            botMsg.bubble.innerHTML = formatContent(fullText);
                            scrollToBottom();
                        }
                    }
                    log('Streaming done. Chunks: ' + chunkCount, 'info');
                } else if (resp && resp.text) {
                    log('Non-streaming response', 'info');
                    fullText = resp.text;
                    botMsg.bubble.innerHTML = formatContent(fullText);
                } else {
                    log('Unexpected response: ' + JSON.stringify(resp).substring(0, 200), 'error');
                    fullText = 'অজানা response format পাওয়া গেছে।';
                    botMsg.bubble.innerHTML = formatContent(fullText);
                }

                messages.push({ role: 'assistant', content: fullText });
                setStatus('ready', 'Ready');

            } catch (err) {
                typingIndicator.classList.remove('active');
                log('ERROR: ' + (err.message || err), 'error');
                console.error(err);

                let errorMsg = '❌ কিছু একটা সমস্যা হয়েছে।';
                const msg = err.message || '';
                if (msg.includes('insufficient_funds') || msg.includes('402')) {
                    errorMsg = '⚠️ Free credits শেষ! Puter-এ login করুন।';
                } else if (msg.includes('usage-limited') || msg.includes('rate')) {
                    errorMsg = '⚠️ Rate limit! কিছুক্ষণ পর আবার চেষ্টা করুন।';
                } else if (msg.includes('network') || msg.includes('fetch')) {
                    errorMsg = '⚠️ Network error! Internet connection চেক করুন।';
                } else if (msg.includes('login') || msg.includes('auth')) {
                    errorMsg = '⚠️ Login required! Puter-এ account তৈরি করুন।';
                } else if (msg) {
                    errorMsg = '⚠️ Error: ' + msg.substring(0, 100);
                }

                const errMsg = createMessage('bot', errorMsg);
                chatContainer.appendChild(errMsg.div);
                setStatus('error', 'Error');
                showToast(errorMsg);
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                messageInput.focus();
                scrollToBottom();
            }
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // ===== Init =====
        log('Page loaded. Checking Puter.js...', 'info');

        function checkPuter() {
            if (typeof puter !== 'undefined') {
                log('Puter.js loaded successfully!', 'info');
                log('puter.ai: ' + typeof puter.ai, 'info');
                log('puter.ai.chat: ' + typeof puter.ai.chat, 'info');
                puterReady = true;
                setStatus('ready', 'Ready');
                showToast('Puter.js ready! Chat শুরু করুন।');
            } else {
                log('Puter.js not loaded yet, retrying...', 'warn');
                setStatus('loading', 'Loading Puter.js...');
                setTimeout(checkPuter, 1000);
            }
        }

        // Start checking after a short delay
        setTimeout(checkPuter, 500);
        messageInput.focus();
    </script>
</body>
</html>
