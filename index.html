<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Neuron AI · Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background:#0a0f15; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:8px; }
        .app { max-width:480px; width:100%; background:#0d1a1f; border-radius:28px; border:1px solid #1e3a42; height:94vh; display:flex; flex-direction:column; overflow:hidden; position:relative; }
        
        /* Chat Background */
        .chat-bg { position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; background-size:cover; background-position:center; opacity:0.15; pointer-events:none; }
        .chat-bg.default { background: radial-gradient(ellipse at center, #0d2b33 0%, #061014 100%); }
        
        /* Header - WhatsApp style */
        .header { padding:10px 14px 8px; background:rgba(13,26,31,0.92); backdrop-filter:blur(12px); border-bottom:1px solid #1e3a42; display:flex; align-items:center; gap:10px; z-index:1; position:relative; }
        .header .back { color:#7bc8d4; font-size:1.2rem; cursor:pointer; }
        .header .dp { width:42px; height:42px; border-radius:50%; background:#1e3a42; overflow:hidden; border:2px solid #2a5a66; flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .header .dp img { width:100%; height:100%; object-fit:cover; }
        .header .dp i { font-size:1.2rem; color:#5a8a96; }
        .header .info { flex:1; }
        .header .info .name { color:#e8f0f3; font-size:1rem; font-weight:600; }
        .header .info .status { color:#7bc8d4; font-size:0.65rem; display:flex; align-items:center; gap:4px; }
        .header .info .status .dot { width:6px; height:6px; border-radius:50%; background:#4cdb7b; display:inline-block; }
        .header .actions { display:flex; gap:12px; color:#7bc8d4; font-size:1.1rem; }
        .header .actions span { cursor:pointer; }
        
        /* Profile Edit Modal */
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:100; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
        .modal-overlay.active { display:flex; }
        .modal { background:#1a2f36; border-radius:24px; padding:24px; max-width:380px; width:90%; border:1px solid #2a5a66; }
        .modal h3 { color:#e8f0f3; margin-bottom:16px; text-align:center; font-size:1.1rem; }
        .modal .preview { display:flex; gap:20px; justify-content:center; align-items:center; margin-bottom:16px; }
        .modal .preview .dp-preview { width:70px; height:70px; border-radius:50%; background:#1e3a42; overflow:hidden; border:2px solid #2a5a66; display:flex; align-items:center; justify-content:center; }
        .modal .preview .dp-preview img { width:100%; height:100%; object-fit:cover; }
        .modal .preview .dp-preview i { font-size:2rem; color:#5a8a96; }
        .modal .preview .bg-preview { width:100px; height:70px; border-radius:12px; background:#0d2b33; overflow:hidden; border:1px solid #1e3a42; display:flex; align-items:center; justify-content:center; font-size:0.6rem; color:#5a8a96; }
        .modal .preview .bg-preview img { width:100%; height:100%; object-fit:cover; }
        .modal .btn-group { display:flex; flex-direction:column; gap:8px; }
        .modal .btn-group label { background:#1e3a42; color:#b0dbe8; padding:8px 12px; border-radius:30px; text-align:center; font-size:0.8rem; cursor:pointer; border:1px solid #2a5a66; }
        .modal .btn-group label i { margin-right:6px; }
        .modal .btn-group input[type="file"] { display:none; }
        .modal .btn-close { background:#2a5a66; color:#e8f0f3; border:none; padding:8px; border-radius:30px; margin-top:8px; font-size:0.8rem; cursor:pointer; }
        
        /* Chat Messages - WhatsApp style */
        .chat { flex:1; overflow-y:auto; padding:12px 14px 6px; display:flex; flex-direction:column; gap:6px; background:transparent; scroll-behavior:smooth; z-index:1; position:relative; }
        .msg { display:flex; flex-direction:column; max-width:85%; animation:fadeUp 0.2s ease; }
        .msg.user { align-self:flex-end; }
        .msg.agi { align-self:flex-start; }
        .bubble { padding:8px 12px; border-radius:16px; background:#1a2f36; color:#e0edf3; word-wrap:break-word; line-height:1.5; font-size:0.88rem; border:1px solid #1e3a42; }
        .msg.user .bubble { background:#1a5a6a; border-color:#2a7a8a; color:#fff; border-bottom-right-radius:4px; }
        .msg.agi .bubble { background:#14242a; border-bottom-left-radius:4px; border-color:#1a3a42; }
        .msg .time { font-size:0.5rem; color:#5a8a96; padding:2px 8px 0; text-align:right; }
        .msg.user .time { color:#6a9aaa; }
        
        /* Input - WhatsApp style */
        .input-area { padding:8px 12px 12px; background:rgba(13,26,31,0.92); backdrop-filter:blur(12px); border-top:1px solid #1e3a42; z-index:1; position:relative; }
        .input-row { display:flex; gap:6px; align-items:flex-end; background:#1a2f36; border-radius:24px; padding:4px 4px 4px 14px; border:1px solid #1e3a42; }
        .input-row textarea { flex:1; background:transparent; border:none; padding:8px 4px; color:#e8f0f3; font-size:0.88rem; resize:none; outline:none; min-height:38px; max-height:80px; line-height:1.4; }
        .input-row textarea::placeholder { color:#5a8a96; }
        .input-row .attach-btn { color:#5a8a96; font-size:1.1rem; cursor:pointer; padding:4px; }
        .input-row .send-btn { background:#2a5a66; border:none; border-radius:50%; width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:1rem; cursor:pointer; }
        .input-row .send-btn:active { transform:scale(0.92); background:#1a4a56; }
        .input-row .send-btn i { margin-left:2px; }
        
        .typing-indicator { display:flex; align-items:center; gap:6px; padding:4px 14px; color:#5a8a96; font-size:0.7rem; }
        .typing-dots span { display:inline-block; width:5px; height:5px; background:#7bc8d4; border-radius:50%; margin:0 2px; animation:typingBounce 1.2s infinite; }
        .typing-dots span:nth-child(2) { animation-delay:0.2s; }
        .typing-dots span:nth-child(3) { animation-delay:0.4s; }
        @keyframes typingBounce { 0%,60%,100%{transform:translateY(0);opacity:0.4;} 30%{transform:translateY(-5px);opacity:1;} }
        @keyframes fadeUp { from{opacity:0.3;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
        .chat::-webkit-scrollbar { width:3px; }
        .chat::-webkit-scrollbar-track { background:transparent; }
        .chat::-webkit-scrollbar-thumb { background:#1e3a42; border-radius:20px; }
        .copy-btn { background:#1a3a42; border:none; color:#7a9aaa; padding:1px 8px; border-radius:20px; font-size:0.5rem; cursor:pointer; float:right; margin:2px 0 0 6px; }
        .copy-btn:hover { background:#2a4a56; }
        .hljs { background:#0d1a1f !important; border-radius:6px; }
        
        .api-selector { display:flex; gap:6px; padding:2px 0; }
        .api-selector button { background:transparent; border:1px solid #1e3a42; color:#5a8a96; padding:1px 12px; border-radius:30px; font-size:0.55rem; cursor:pointer; transition:0.15s; }
        .api-selector button.active { background:#1a5a6a; border-color:#2a7a8a; color:#fff; }
        .api-label { font-size:0.5rem; color:#5a8a96; }
        .attach-bar { display:flex; gap:6px; align-items:center; padding:2px 4px; flex-wrap:wrap; }
        .attach-bar label { color:#5a8a96; font-size:0.6rem; cursor:pointer; }
        .attach-bar label i { margin-right:4px; }
        .attach-bar input[type="file"] { display:none; }
        .file-name { color:#5a8a96; font-size:0.55rem; max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .clear-mem { background:transparent; border:none; color:#5a8a96; font-size:0.55rem; cursor:pointer; margin-left:auto; }
        .msg-meta { display:none; }
        .bubble pre { background:#0d1a1f; border-radius:8px; padding:8px; margin:4px 0; overflow-x:auto; border:1px solid #1a3a42; }
        .bubble code { font-family:'Fira Code', monospace; font-size:0.78rem; }
        .bubble h1,.bubble h2,.bubble h3 { color:#b0dbe8; margin:4px 0 2px; font-size:0.95rem; }
        .bubble ul,.bubble ol { padding-left:16px; margin:3px 0; }
        .bubble p { margin:2px 0; }
    </style>
</head>
<body>
<div class="app" id="app">
    <!-- Background Image -->
    <div class="chat-bg default" id="chatBg"></div>
    
    <!-- Header -->
    <div class="header">
        <div class="back" id="backBtn"><i class="fas fa-chevron-left"></i></div>
        <div class="dp" id="profileDp" onclick="document.getElementById('dpInput').click()">
            <img id="dpImage" src="" style="display:none;">
            <i id="dpIcon" class="fas fa-robot"></i>
        </div>
        <input type="file" id="dpInput" accept="image/*" style="display:none;">
        <div class="info">
            <div class="name" id="botName">Neuron AI</div>
            <div class="status"><span class="dot"></span> <span id="statusText">অনলাইন</span></div>
        </div>
        <div class="actions">
            <span onclick="document.getElementById('bgInput').click()"><i class="fas fa-image"></i></span>
            <span onclick="toggleModal()"><i class="fas fa-ellipsis-v"></i></span>
        </div>
    </div>
    <input type="file" id="bgInput" accept="image/*" style="display:none;">
    
    <!-- Profile Modal -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal">
            <h3><i class="fas fa-robot"></i> প্রোফাইল সেটিং</h3>
            <div class="preview">
                <div class="dp-preview" id="dpPreview"><i class="fas fa-robot"></i></div>
                <div class="bg-preview" id="bgPreview">Background</div>
            </div>
            <div class="btn-group">
                <label for="dpModalInput"><i class="fas fa-user-circle"></i> প্রোফাইল ছবি পরিবর্তন</label>
                <input type="file" id="dpModalInput" accept="image/*">
                <label for="bgModalInput"><i class="fas fa-image"></i> ব্যাকগ্রাউন্ড পরিবর্তন</label>
                <input type="file" id="bgModalInput" accept="image/*">
                <label for="nameInput"><i class="fas fa-edit"></i> নাম পরিবর্তন</label>
                <input type="text" id="nameInput" value="Neuron AI" style="background:#0d2b33;border:1px solid #1e3a42;border-radius:30px;padding:6px 14px;color:#e8f0f3;outline:none;font-size:0.8rem;">
            </div>
            <button class="btn-close" onclick="saveProfile()"><i class="fas fa-check"></i> সংরক্ষণ করুন</button>
            <button class="btn-close" style="background:#2a4a56;margin-top:4px;" onclick="toggleModal()">বন্ধ করুন</button>
        </div>
    </div>
    
    <!-- Chat Messages -->
    <div class="chat" id="chatContainer">
        <div class="msg agi">
            <div class="bubble"><i class="fas fa-robot" style="color:#7bc8d4;margin-right:6px;"></i> হ্যালো! আমি Neuron AI। কীভাবে সাহায্য করতে পারি?</div>
            <div class="time">now</div>
        </div>
    </div>
    
    <!-- Input -->
    <div class="input-area">
        <div class="input-row">
            <textarea id="prompt" rows="1" placeholder="মেসেজ লিখুন..."></textarea>
            <span class="attach-btn" id="attachBtn"><i class="fas fa-paperclip"></i></span>
            <input type="file" id="fileInput" accept=".txt,.js,.py,.html,.css,.json,.md,.csv,.xml,.yml,.java,.c,.cpp,.go,.rs,.sh,.rb,.php,.zip" style="display:none;">
            <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:2px 6px 0;">
            <div class="api-selector" id="apiSelector">
                <button class="active" data-api="ppg">PPG</button>
                <button data-api="ppo">PPO</button>
            </div>
            <span class="api-label" id="apiLabel">PPG</span>
            <span class="clear-mem" id="clearMemBtn"><i class="fas fa-eraser"></i></span>
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;padding:0 4px;">
            <span class="file-name" id="fileName"></span>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
    // ---------- API Keys ----------
    const ENCRYPTED_KEYS = {
        openrouter: 'c2stb3ItdjEtOGRiZWYxYmRjYjJmOTA4N2IzMDQ1NjY2ZTg1YjI5MmY4MDllZGUwNDBiNGMyYTNiMTkxNGIwNDNlYThhMTA3ZQ==',
        gemini: 'QVEuQWI4Uk42S0JwWWVYeFBRU25hUnJTZERSa2RvSFlqRGNpNkthRVZBR1ZIQ3ZFV18wWVE='
    };
    
    function decodeKey(encoded) {
        try { return atob(encoded); } catch(e) { return ''; }
    }
    
    const OPENROUTER_KEY = decodeKey(ENCRYPTED_KEYS.openrouter);
    const GEMINI_KEY = decodeKey(ENCRYPTED_KEYS.gemini);
    
    // ---------- API PROVIDERS ----------
    const API_PROVIDERS = {
        'ppg': {
            label: 'PPG',
            apiKey: GEMINI_KEY,
            baseUrl: 'https://generativelanguage.googleapis.com/v1beta/models',
            models: ['gemini-3.5-flash', 'gemini-3.1-flash-lite', 'gemma-4-31b-it', 'gemini-3.6-flash'],
            fallbackModels: ['gemini-3.5-flash', 'gemini-3.1-flash-lite']
        },
        'ppo': {
            label: 'PPO',
            apiKey: OPENROUTER_KEY,
            baseUrl: 'https://openrouter.ai/api/v1/chat/completions',
            models: ['deepseek/deepseek-r1:free', 'meta-llama/llama-3.3-70b-instruct:free', 'mistralai/mistral-7b-instruct:free', 'qwen/qwen-2.5-coder-32b-instruct:free', 'openrouter/free'],
            fallbackModels: ['deepseek/deepseek-r1:free', 'meta-llama/llama-3.3-70b-instruct:free', 'openrouter/free']
        }
    };
    
    // ---------- DOM ----------
    const chat = document.getElementById('chatContainer');
    const prompt = document.getElementById('prompt');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const clearBtn = document.getElementById('clearMemBtn');
    const apiSelector = document.getElementById('apiSelector');
    const apiLabel = document.getElementById('apiLabel');
    const chatBg = document.getElementById('chatBg');
    const dpImage = document.getElementById('dpImage');
    const dpIcon = document.getElementById('dpIcon');
    const botName = document.getElementById('botName');
    const statusText = document.getElementById('statusText');
    const dpInput = document.getElementById('dpInput');
    const bgInput = document.getElementById('bgInput');
    const attachBtn = document.getElementById('attachBtn');
    
    // ---------- STATE ----------
    let currentAPI = 'ppg';
    let currentMode = 'simple';
    let isProcessing = false;
    let memoryStore = [];
    let botProfile = { name: 'Neuron AI', dp: '', bg: '' };
    
    // Load from localStorage
    try {
        const m = localStorage.getItem('neuron_agi_mode');
        if (m === 'advance' || m === 'simple') currentMode = m;
    } catch(e) {}
    try {
        const a = localStorage.getItem('neuron_agi_api');
        if (a === 'ppg' || a === 'ppo') currentAPI = a;
    } catch(e) {}
    try {
        const p = localStorage.getItem('neuron_bot_profile');
        if (p) botProfile = JSON.parse(p);
        if (botProfile.dp) { dpImage.src = botProfile.dp; dpImage.style.display = 'block'; dpIcon.style.display = 'none'; }
        if (botProfile.bg) { chatBg.style.backgroundImage = `url(${botProfile.bg})`; chatBg.className = 'chat-bg'; }
        if (botProfile.name) botName.textContent = botProfile.name;
    } catch(e) {}
    try {
        const stored = localStorage.getItem('neuron_agi_memory_v9');
        if (stored) memoryStore = JSON.parse(stored);
        if (!Array.isArray(memoryStore)) memoryStore = [];
    } catch(e) { memoryStore = []; }
    
    // ---------- API SELECTOR ----------
    function selectAPI(api) {
        currentAPI = api;
        localStorage.setItem('neuron_agi_api', api);
        document.querySelectorAll('#apiSelector button').forEach(b => {
            b.classList.toggle('active', b.dataset.api === api);
        });
        apiLabel.textContent = api.toUpperCase();
    }
    apiSelector.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const api = btn.dataset.api;
        if (api === currentAPI) return;
        selectAPI(api);
        appendMessage('agi', `🔄 ${api.toUpperCase()}`, 'system');
    });
    
    // ---------- MEMORY ----------
    function updateMemCounter() {
        try { localStorage.setItem('neuron_agi_memory_v9', JSON.stringify(memoryStore)); } catch(e) {}
    }
    
    // ---------- VECTOR SEARCH ----------
    function vectorSearch(query, topK = 4) {
        if (!query || memoryStore.length === 0) return memoryStore.slice(-3);
        const words = query.toLowerCase().split(/\s+/).filter(w => w.length > 2);
        if (words.length === 0) return memoryStore.slice(-3);
        const scored = memoryStore.map((item, idx) => {
            const text = (item.content || '').toLowerCase();
            let score = 0;
            words.forEach(w => { if (text.includes(w)) score += 2 + (text.split(w).length - 1) * 0.5; });
            const age = (Date.now() - new Date(item.timestamp || 0).getTime()) / 86400000;
            score += Math.max(0, 1 - age / 30);
            return { idx, score, item };
        });
        scored.sort((a,b) => b.score - a.score);
        const top = scored.filter(s => s.score > 0.3).slice(0, topK);
        if (top.length === 0) return memoryStore.slice(-3);
        return top.map(s => s.item);
    }
    
    // ---------- RENDER ----------
    function renderMarkdown(text) {
        if (!text) return '';
        let html = marked.parse(text);
        const temp = document.createElement('div');
        temp.innerHTML = html;
        temp.querySelectorAll('pre code').forEach(block => {
            hljs.highlightElement(block);
            const pre = block.parentElement;
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.innerHTML = '<i class="fas fa-copy"></i>';
            copyBtn.onclick = () => {
                navigator.clipboard?.writeText(block.textContent);
                copyBtn.innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => copyBtn.innerHTML = '<i class="fas fa-copy"></i>', 1500);
            };
            pre.style.position = 'relative';
            pre.appendChild(copyBtn);
        });
        return temp.innerHTML;
    }
    
    // ---------- APPEND MESSAGE ----------
    function appendMessage(role, content, modelUsed = '') {
        if (!content) return;
        const entry = {
            role: role,
            content: content,
            timestamp: new Date().toISOString()
        };
        memoryStore.push(entry);
        if (memoryStore.length > 500) memoryStore.shift();
        updateMemCounter();
        
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${role === 'user' ? 'user' : 'agi'}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (role === 'agi') bubble.innerHTML = renderMarkdown(content);
        else bubble.textContent = content;
        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        msgDiv.appendChild(bubble);
        msgDiv.appendChild(time);
        chat.appendChild(msgDiv);
        chat.scrollTop = chat.scrollHeight;
        return msgDiv;
    }
    
    // ---------- TYPING ----------
    let typingTimeout = null;
    function showTyping() {
        hideTyping();
        const typing = document.createElement('div');
        typing.className = 'msg agi';
        typing.id = 'typingIndicator';
        typing.innerHTML = `<div class="bubble" style="background:#14242a;border-color:#1a3a42;">
            <div class="typing-indicator"><span class="typing-dots"><span></span><span></span><span></span></span></div>
        </div>`;
        chat.appendChild(typing);
        chat.scrollTop = chat.scrollHeight;
        if (typingTimeout) clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => hideTyping(), 30000);
    }
    function hideTyping() {
        if (typingTimeout) { clearTimeout(typingTimeout); typingTimeout = null; }
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }
    
    // ---------- FILE ----------
    async function processFile(file) {
        const name = file.name.toLowerCase();
        if (name.endsWith('.zip') || name.endsWith('.tar.gz')) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const zip = await JSZip.loadAsync(arrayBuffer);
                let combined = '';
                for (const fname of Object.keys(zip.files)) {
                    const entry = zip.files[fname];
                    if (!entry.dir) {
                        try {
                            const content = await entry.async('string');
                            combined += `\n--- ${fname} ---\n${content.slice(0, 1500)}\n`;
                        } catch(e) {}
                    }
                }
                return { name: file.name, content: combined.slice(0, 10000) };
            } catch(e) { return { name: file.name, content: '[ZIP extract error]' }; }
        } else {
            try {
                let text = await file.text();
                if (text.length > 12000) text = '...(ফাইল বড়, শেষ অংশ)...\n' + text.slice(-10000);
                return { name: file.name, content: text };
            } catch(e) { return { name: file.name, content: '[file read error]' }; }
        }
    }
    
    // ---------- CALL API ----------
    async function callAPI(messages, model, stream = false) {
        const provider = API_PROVIDERS[currentAPI];
        if (!provider) throw new Error('Invalid API');
        
        if (currentAPI === 'ppg') {
            const modelName = model || 'gemini-3.5-flash';
            const url = `${provider.baseUrl}/${modelName}:generateContent?key=${provider.apiKey}`;
            const promptText = messages.map(m => `${m.role}: ${m.content}`).join('\n');
            const trimmed = promptText.length > 4000 ? promptText.slice(0, 4000) : promptText;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: trimmed }] }],
                    generationConfig: { temperature: 0.7, maxOutputTokens: 400 }
                })
            });
            if (!response.ok) {
                for (const fb of provider.fallbackModels) {
                    if (fb === model) continue;
                    try {
                        const fbUrl = `${provider.baseUrl}/${fb}:generateContent?key=${provider.apiKey}`;
                        const fbResp = await fetch(fbUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: trimmed }] }],
                                generationConfig: { temperature: 0.7, maxOutputTokens: 400 }
                            })
                        });
                        if (fbResp.ok) {
                            const data = await fbResp.json();
                            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'No response';
                            return { message: { content: text } };
                        }
                    } catch(e) {}
                }
                throw new Error(`API error: ${response.status}`);
            }
            const data = await response.json();
            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'No response';
            return { message: { content: text } };
            
        } else if (currentAPI === 'ppo') {
            const modelId = model || 'openrouter/free';
            const trimmedMessages = messages.map(m => ({
                role: m.role,
                content: m.content.length > 2500 ? m.content.slice(0, 2500) : m.content
            }));
            
            const response = await fetch(provider.baseUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${provider.apiKey}`,
                    'HTTP-Referer': window.location.origin || 'https://neuron-agi.app',
                    'X-Title': 'Neuron AI'
                },
                body: JSON.stringify({
                    model: modelId,
                    messages: trimmedMessages,
                    stream: stream,
                    temperature: 0.7,
                    max_tokens: 400
                })
            });
            if (!response.ok) {
                for (const fb of provider.fallbackModels) {
                    if (fb === modelId) continue;
                    try {
                        const fbResp = await fetch(provider.baseUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${provider.apiKey}`,
                                'HTTP-Referer': window.location.origin || 'https://neuron-agi.app',
                                'X-Title': 'Neuron AI'
                            },
                            body: JSON.stringify({
                                model: fb,
                                messages: trimmedMessages,
                                stream: stream,
                                temperature: 0.7,
                                max_tokens: 400
                            })
                        });
                        if (fbResp.ok) {
                            if (stream) return fbResp.body;
                            return await fbResp.json();
                        }
                    } catch(e) {}
                }
                throw new Error(`API error: ${response.status}`);
            }
            if (stream) return response.body;
            return await response.json();
        }
        throw new Error('Unknown API');
    }
    
    // ---------- STREAM ----------
    async function processStream(reader, bubble) {
        const decoder = new TextDecoder();
        let fullReply = '';
        let buffer = '';
        try {
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const data = line.slice(6).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const json = JSON.parse(data);
                            const content = json?.choices?.[0]?.delta?.content || json?.choices?.[0]?.message?.content || '';
                            if (content) {
                                fullReply += content;
                                bubble.innerHTML = renderMarkdown(fullReply);
                                chat.scrollTop = chat.scrollHeight;
                            }
                        } catch(e) {}
                    }
                }
            }
        } catch(e) {}
        return fullReply;
    }
    
    // ---------- SEND ----------
    async function handleSend() {
        if (isProcessing) return;
        const userText = prompt.value.trim();
        if (!userText && !fileInput.files.length) return;
        isProcessing = true;
        
        let fullText = userText;
        let fileObj = null;
        
        if (fileInput.files.length > 0) {
            const f = fileInput.files[0];
            const processed = await processFile(f);
            fileObj = processed;
            if (fullText) fullText += '\n\n[ফাইল: ' + processed.name + ']\n' + processed.content;
            else fullText = '[ফাইল: ' + processed.name + ']\n' + processed.content;
            fileName.textContent = f.name.length > 20 ? f.name.slice(0,18)+'…' : f.name;
            fileInput.value = '';
        }
        
        if (!fullText) { isProcessing = false; return; }
        
        appendMessage('user', fullText);
        prompt.value = '';
        if (!fileInput.files.length) fileName.textContent = '';
        
        // Build context
        const recentMem = memoryStore.slice(-6).map(m => `${m.role}: ${(m.content||'').substring(0,150)}`).join('\n');
        const systemPrompt = 'You are a helpful AI assistant. Keep responses short and clear. Use markdown. Be conversational like WhatsApp chat.';
        const messages = [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: `[মেমরি]\n${recentMem}\n\nব্যবহারকারী: ${fullText}\n\nউত্তর:` }
        ];
        
        showTyping();
        
        try {
            const canStream = currentAPI === 'ppo';
            if (canStream) {
                const response = await callAPI(messages, 'openrouter/free', true);
                if (response && response.body) {
                    const reader = response.body.getReader();
                    hideTyping();
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'msg agi';
                    const bubble = document.createElement('div');
                    bubble.className = 'bubble';
                    const time = document.createElement('div');
                    time.className = 'time';
                    time.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                    msgDiv.appendChild(bubble);
                    msgDiv.appendChild(time);
                    chat.appendChild(msgDiv);
                    
                    const reply = await processStream(reader, bubble);
                    if (!reply) {
                        const fallback = await callAPI(messages, 'openrouter/free', false);
                        const text = fallback?.message?.content || fallback?.choices?.[0]?.message?.content || 'No response';
                        bubble.innerHTML = renderMarkdown(text);
                    }
                    const entry = { role: 'agi', content: reply || 'No response' };
                    memoryStore.push(entry);
                    if (memoryStore.length > 500) memoryStore.shift();
                    updateMemCounter();
                } else {
                    hideTyping();
                    const data = await callAPI(messages, 'openrouter/free', false);
                    let reply = data?.message?.content || data?.choices?.[0]?.message?.content || 'No response';
                    if (typeof reply === 'object') reply = JSON.stringify(reply);
                    appendMessage('agi', reply);
                }
            } else {
                hideTyping();
                const data = await callAPI(messages, 'gemini-3.5-flash', false);
                let reply = data?.message?.content || 'No response';
                if (typeof reply === 'object') reply = JSON.stringify(reply);
                appendMessage('agi', reply);
            }
        } catch(err) {
            hideTyping();
            console.error(err);
            // Auto-fallback
            try {
                const fallbackList = ['openrouter/free', 'deepseek/deepseek-r1:free', 'meta-llama/llama-3.3-70b-instruct:free'];
                for (const fb of fallbackList) {
                    try {
                        const resp = await callAPI(messages, fb, false);
                        const reply = resp?.message?.content || resp?.choices?.[0]?.message?.content;
                        if (reply) { appendMessage('agi', reply); break; }
                    } catch(e) {}
                }
            } catch(e2) {
                appendMessage('agi', '⚠️ সংযোগ সমস্যা, আবার চেষ্টা করুন।');
            }
        }
        isProcessing = false;
    }
    
    // ---------- PROFILE ----------
    function toggleModal() {
        const modal = document.getElementById('profileModal');
        modal.classList.toggle('active');
        document.getElementById('nameInput').value = botName.textContent;
        const dpPreview = document.getElementById('dpPreview');
        if (botProfile.dp) { dpPreview.innerHTML = `<img src="${botProfile.dp}" style="width:100%;height:100%;object-fit:cover;">`; }
        else { dpPreview.innerHTML = '<i class="fas fa-robot"></i>'; }
        const bgPreview = document.getElementById('bgPreview');
        if (botProfile.bg) { bgPreview.innerHTML = `<img src="${botProfile.bg}" style="width:100%;height:100%;object-fit:cover;">`; }
        else { bgPreview.textContent = 'Background'; }
    }
    
    function saveProfile() {
        const name = document.getElementById('nameInput').value.trim() || 'Neuron AI';
        botName.textContent = name;
        botProfile.name = name;
        localStorage.setItem('neuron_bot_profile', JSON.stringify(botProfile));
        toggleModal();
    }
    
    // DP upload
    dpInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            botProfile.dp = ev.target.result;
            dpImage.src = ev.target.result;
            dpImage.style.display = 'block';
            dpIcon.style.display = 'none';
            localStorage.setItem('neuron_bot_profile', JSON.stringify(botProfile));
        };
        reader.readAsDataURL(file);
    });
    
    // BG upload
    bgInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            botProfile.bg = ev.target.result;
            chatBg.style.backgroundImage = `url(${ev.target.result})`;
            chatBg.className = 'chat-bg';
            localStorage.setItem('neuron_bot_profile', JSON.stringify(botProfile));
        };
        reader.readAsDataURL(file);
    });
    
    // Modal DP/BG
    document.getElementById('dpModalInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            botProfile.dp = ev.target.result;
            dpImage.src = ev.target.result;
            dpImage.style.display = 'block';
            dpIcon.style.display = 'none';
            document.getElementById('dpPreview').innerHTML = `<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;">`;
            localStorage.setItem('neuron_bot_profile', JSON.stringify(botProfile));
        };
        reader.readAsDataURL(file);
    });
    
    document.getElementById('bgModalInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            botProfile.bg = ev.target.result;
            chatBg.style.backgroundImage = `url(${ev.target.result})`;
            chatBg.className = 'chat-bg';
            document.getElementById('bgPreview').innerHTML = `<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;">`;
            localStorage.setItem('neuron_bot_profile', JSON.stringify(botProfile));
        };
        reader.readAsDataURL(file);
    });
    
    // ---------- EVENTS ----------
    sendBtn.addEventListener('click', handleSend);
    prompt.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });
    prompt.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 80) + 'px';
    });
    
    attachBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', function() {
        if (this.files.length > 0) {
            fileName.textContent = this.files[0].name.length > 25 ? this.files[0].name.slice(0,22)+'…' : this.files[0].name;
        }
    });
    
    clearBtn.addEventListener('click', () => {
        memoryStore = [];
        updateMemCounter();
        chat.innerHTML = '';
        const welcome = document.createElement('div');
        welcome.className = 'msg agi';
        welcome.innerHTML = `<div class="bubble"><i class="fas fa-robot" style="color:#7bc8d4;margin-right:6px;"></i> মেমরি রিসেট।</div><div class="time">now</div>`;
        chat.appendChild(welcome);
    });
    
    document.getElementById('backBtn').addEventListener('click', () => {
        if (confirm('চ্যাট বন্ধ করবেন?')) {
            document.querySelector('.app').style.opacity = '0.3';
            setTimeout(() => document.querySelector('.app').style.opacity = '1', 100);
        }
    });
    
    // Initial
    updateMemCounter();
    selectAPI(currentAPI);
    console.log('✅ Neuron AI - WhatsApp style chat with profile & background');
})();
</script>
