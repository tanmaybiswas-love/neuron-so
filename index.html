<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Neuron AGI · Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background:#0a0f15; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:8px; }
        .app { max-width:480px; width:100%; background:#131b24; border-radius:32px; border:1px solid #2a3542; height:94vh; display:flex; flex-direction:column; overflow:hidden; }
        .header { padding:12px 16px 8px; background:#17212b; border-bottom:1px solid #2b3848; display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
        .header .left { display:flex; align-items:center; gap:6px; flex:1; }
        .header .left i { color:#6fcf97; font-size:1.5rem; }
        .header .left h1 { color:#ecf3fa; font-size:1.1rem; font-weight:600; }
        .mode-toggle { background:#0f171f; border-radius:40px; padding:3px; display:flex; border:1px solid #2c3d4e; }
        .mode-toggle button { background:transparent; border:none; color:#8aa9c7; padding:4px 12px; border-radius:30px; font-size:0.65rem; font-weight:600; cursor:pointer; transition:0.15s; }
        .mode-toggle button.active { background:#2b6b9c; color:#fff; }
        .model-selector { background:#0f171f; border-radius:40px; padding:2px 10px 2px 14px; display:flex; align-items:center; gap:4px; border:1px solid #314152; margin-left:auto; }
        .model-selector select { background:transparent; border:none; color:#c4d9ed; font-weight:500; font-size:0.7rem; padding:4px 0; outline:none; max-width:120px; cursor:pointer; }
        .model-selector select option { background:#1a2633; color:#dfecf5; }
        .model-selector i { color:#6fcf97; font-size:0.7rem; }
        .memory-stats { display:flex; justify-content:space-between; padding:3px 14px 5px; background:#101a22; border-bottom:1px solid #1e2c3a; font-size:0.6rem; color:#8baac9; flex-wrap:wrap; }
        .memory-stats span i { margin-right:3px; color:#6fcf97; }
        .badge-mem { background:#1a2938; padding:1px 12px; border-radius:40px; color:#b6d4ef; }
        .chat { flex:1; overflow-y:auto; padding:12px 12px 4px; display:flex; flex-direction:column; gap:10px; background:#0d151e; scroll-behavior:smooth; }
        .msg { display:flex; flex-direction:column; max-width:92%; animation:fadeUp 0.25s ease; }
        .msg.user { align-self:flex-end; }
        .msg.agi { align-self:flex-start; }
        .bubble { padding:10px 14px; border-radius:20px; background:#1e2a36; color:#e3edf7; word-wrap:break-word; line-height:1.6; font-size:0.88rem; border:1px solid #2d3d4d; overflow-x:auto; }
        .bubble pre { background:#0d1520; border-radius:10px; padding:10px; margin:6px 0; overflow-x:auto; border:1px solid #2a3a4a; }
        .bubble code { font-family:'Fira Code', monospace; font-size:0.82rem; }
        .bubble h1,.bubble h2,.bubble h3 { color:#d6e8f7; margin:6px 0 3px; }
        .bubble ul,.bubble ol { padding-left:18px; margin:4px 0; }
        .bubble p { margin:3px 0; }
        .msg.user .bubble { background:#1f5a82; border-color:#3d89c0; color:#fff; border-bottom-right-radius:4px; }
        .msg.agi .bubble { background:#17222e; border-bottom-left-radius:4px; border-color:#334a5e; }
        .msg-meta { display:flex; justify-content:space-between; font-size:0.55rem; color:#6e8aa8; padding:2px 8px 0; }
        .msg-meta .tag { background:#1d2b3b; padding:0 10px; border-radius:30px; color:#b2cfe9; }
        .input-area { padding:6px 12px 12px; background:#121c26; border-top:1px solid #25323f; display:flex; flex-direction:column; gap:4px; }
        .input-row { display:flex; gap:6px; align-items:flex-end; }
        .input-row textarea { flex:1; background:#1a2633; border:1px solid #2e3f50; border-radius:24px; padding:10px 16px; color:#e2eefb; font-size:0.85rem; resize:none; outline:none; min-height:42px; max-height:100px; line-height:1.4; }
        .input-row textarea:focus { border-color:#4a8fc9; }
        .input-row button { background:#2b6b9c; border:none; border-radius:40px; width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:1.2rem; cursor:pointer; border:1px solid #3f84bb; }
        .input-row button:active { transform:scale(0.92); background:#1f5a82; }
        .attach-bar { display:flex; align-items:center; gap:8px; padding-left:2px; flex-wrap:wrap; }
        .attach-bar label { color:#82a5c7; font-size:0.7rem; background:#1a2736; padding:3px 14px 3px 10px; border-radius:40px; border:1px dashed #3e5368; display:flex; align-items:center; gap:4px; cursor:pointer; }
        .attach-bar label i { color:#6fcf97; }
        .attach-bar input[type="file"] { display:none; }
        .file-name { color:#9bbde0; font-size:0.65rem; background:#172433; padding:2px 12px; border-radius:40px; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .clear-mem { background:transparent; border:1px solid #2e4053; color:#7c9ebf; padding:3px 12px; border-radius:40px; font-size:0.65rem; cursor:pointer; background:#15212d; display:flex; align-items:center; gap:3px; margin-left:auto; }
        .clear-mem:active { background:#253646; }
        .typing-indicator { display:flex; align-items:center; gap:6px; padding:6px 14px; color:#8baac9; font-size:0.75rem; }
        .typing-dots span { display:inline-block; width:5px; height:5px; background:#6fcf97; border-radius:50%; margin:0 2px; animation:typingBounce 1.2s infinite; }
        .typing-dots span:nth-child(2) { animation-delay:0.2s; }
        .typing-dots span:nth-child(3) { animation-delay:0.4s; }
        @keyframes typingBounce { 0%,60%,100%{transform:translateY(0);opacity:0.4;} 30%{transform:translateY(-5px);opacity:1;} }
        @keyframes fadeUp { from{opacity:0.3;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
        .chat::-webkit-scrollbar { width:3px; }
        .chat::-webkit-scrollbar-track { background:#101b26; }
        .chat::-webkit-scrollbar-thumb { background:#3a526b; border-radius:20px; }
        .copy-btn { background:#2a3a4a; border:none; color:#aac3db; padding:1px 8px; border-radius:20px; font-size:0.55rem; cursor:pointer; float:right; margin:2px 0 0 6px; }
        .copy-btn:hover { background:#3a5068; }
        .hljs { background:#0d1520 !important; border-radius:6px; }
        .api-selector { display:flex; gap:4px; padding:2px 0; }
        .api-selector button { background:#1a2736; border:1px solid #2e4053; color:#8baac9; padding:2px 10px; border-radius:30px; font-size:0.6rem; cursor:pointer; transition:0.15s; }
        .api-selector button.active { background:#2b6b9c; border-color:#3f84bb; color:#fff; }
        .api-selector button:active { transform:scale(0.95); }
        .security-notice { font-size:0.5rem; color:#5f7f9c; padding:0 4px; }
        .api-label { font-size:0.55rem; color:#6fcf97; }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="header">
        <div class="left"><i class="fas fa-brain"></i><h1>Neuron AGI</h1></div>
        <div class="mode-toggle" id="modeToggle">
            <button class="active" data-mode="simple">সরল</button>
            <button data-mode="advance">AGI</button>
        </div>
        <div class="model-selector">
            <i class="fas fa-microchip"></i>
            <select id="modelSelect"><option value="">লোড হচ্ছে...</option></select>
        </div>
    </div>
    <div class="memory-stats">
        <span><i class="fas fa-database"></i> মেমরি: <span id="memCount">0</span></span>
        <span class="badge-mem"><i class="fas fa-brain"></i> AGI auto‑plan</span>
        <span><i class="fas fa-sync-alt"></i> <span id="modeLabel">সরল</span></span>
    </div>
    <div class="chat" id="chatContainer">
        <div class="msg agi"><div class="bubble"><i class="fas fa-brain" style="color:#6fcf97;margin-right:6px;"></i> Neuron AGI সক্রিয়। <span id="greetingMode">সরল</span> মোড।</div><div class="msg-meta"><span class="tag">system</span><span>now</span></div></div>
    </div>
    <div class="input-area">
        <div class="input-row">
            <textarea id="prompt" rows="1" placeholder="মেসেজ বা কোড দিন..."></textarea>
            <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
        <div class="attach-bar">
            <label for="fileInput"><i class="fas fa-paperclip"></i> ফাইল</label>
            <input type="file" id="fileInput" accept=".txt,.js,.py,.html,.css,.json,.md,.csv,.xml,.yml,.java,.c,.cpp,.go,.rs,.sh,.rb,.php,.zip">
            <span class="file-name" id="fileName">কোন ফাইল নেই</span>
            <button class="clear-mem" id="clearMemBtn"><i class="fas fa-eraser"></i> রিসেট</button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;">
            <div class="api-selector" id="apiSelector">
                <button class="active" data-api="ppg">PPG</button>
                <button data-api="ppo">PPO</button>
                <button data-api="ppl">PPL</button>
            </div>
            <span class="api-label" id="apiLabel"><i class="fas fa-key"></i> PPG · Google</span>
            <span id="modelCount" style="font-size:0.55rem;color:#5f7f9c;">Model: 20+</span>
        </div>
        <div class="security-notice"><i class="fas fa-shield-alt"></i> এনক্রিপ্টেড</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
    // ---------- API Keys (এনক্রিপ্টেড) ----------
    const ENCRYPTED_KEYS = {
        openrouter: 'c2stb3ItdjEtOGRiZWYxYmRjYjJmOTA4N2IzMDQ1NjY2ZTg1YjI5MmY4MDllZGUwNDBiNGMyYTNiMTkxNGIwNDNlYThhMTA3ZQ==',
        gemini: 'QVEuQWI4Uk42S0JwWWVYeFBRU25hUnJTZERSa2RvSFlqRGNpNkthRVZBR1ZIQ3ZFV18wWVE=',
        glm: 'NDY2OTRkYmM2NWFiNDdjNmIzYWFjOTRhYThlNDEwMi5KM3pwQXRiZ29KNFJIM3BI'
    };
    
    function decodeKey(encoded) {
        try { return atob(encoded); } catch(e) { return ''; }
    }
    
    const OPENROUTER_KEY = decodeKey(ENCRYPTED_KEYS.openrouter);
    const GEMINI_KEY = decodeKey(ENCRYPTED_KEYS.gemini);
    const GLM_KEY = decodeKey(ENCRYPTED_KEYS.glm);
    
    // ---------- API PROVIDER SETTINGS (শুধু ফ্রি মডেল) ----------
    const API_PROVIDERS = {
        'ppg': {
            label: 'PPG · Google',
            icon: 'google',
            apiKey: GEMINI_KEY,
            baseUrl: 'https://generativelanguage.googleapis.com/v1beta/models',
            models: [
                'gemini-3.5-flash', 'gemini-3.1-flash-lite', 'gemma-4-31b-it', 'gemini-3.6-flash'
            ],
            fallbackModels: ['gemini-3.5-flash', 'gemini-3.1-flash-lite', 'gemma-4-31b-it']
        },
        'ppo': {
            label: 'PPO · OpenRouter',
            icon: 'openrouter',
            apiKey: OPENROUTER_KEY,
            baseUrl: 'https://openrouter.ai/api/v1/chat/completions',
            // শুধু ফ্রি মডেল - Claude/GPT বাদ
            models: [
                'deepseek/deepseek-r1:free',
                'deepseek/deepseek-v3.2:free',
                'meta-llama/llama-3.3-70b-instruct:free',
                'google/gemma-4-31b-it:free',
                'qwen/qwen-2.5-coder-32b-instruct:free',
                'qwen/qwen-2.5-72b:free',
                'nvidia/nemotron-3-super-120b-a12b:free',
                'xiaomi/mimo-v2-flash:free',
                'qwen/qwen3.6-plus-preview:free',
                'mistral/mistral-large:free'
            ],
            fallbackModels: [
                'deepseek/deepseek-r1:free',
                'meta-llama/llama-3.3-70b-instruct:free',
                'qwen/qwen-2.5-coder-32b-instruct:free'
            ]
        },
        'ppl': {
            label: 'PPL · GLM',
            icon: 'glm',
            apiKey: GLM_KEY,
            baseUrl: 'https://open.bigmodel.cn/api/paas/v4/chat/completions',
            models: ['glm-5.2', 'glm-4', 'glm-4-flash', 'glm-4v-plus', 'glm-4-air'],
            fallbackModels: ['glm-4', 'glm-4-flash', 'glm-4-air']
        }
    };
    
    // ---------- MODEL LIST (শুধু ফ্রি) ----------
    const MODEL_LIST = {
        // PPG (Google)
        'gemini-3.5-flash': 'Gemini 3.5 Flash',
        'gemini-3.1-flash-lite': 'Gemini 3.1 Flash Lite',
        'gemma-4-31b-it': 'Gemma 4 31B IT',
        'gemini-3.6-flash': 'Gemini 3.6 Flash',
        // PPO (OpenRouter - শুধু ফ্রি)
        'deepseek/deepseek-r1:free': 'DeepSeek R1 (Free)',
        'deepseek/deepseek-v3.2:free': 'DeepSeek v3.2 (Free)',
        'meta-llama/llama-3.3-70b-instruct:free': 'Llama 3.3 70B (Free)',
        'google/gemma-4-31b-it:free': 'Gemma 4 31B IT (Free)',
        'qwen/qwen-2.5-coder-32b-instruct:free': 'Qwen 2.5 Coder (Free)',
        'qwen/qwen-2.5-72b:free': 'Qwen 2.5 72B (Free)',
        'nvidia/nemotron-3-super-120b-a12b:free': 'NVIDIA Nemotron 3 (Free)',
        'xiaomi/mimo-v2-flash:free': 'Xiaomi MiMo V2 (Free)',
        'qwen/qwen3.6-plus-preview:free': 'Qwen 3.6 Plus (Free)',
        'mistral/mistral-large:free': 'Mistral Large (Free)',
        // PPL (GLM)
        'glm-5.2': 'GLM 5.2',
        'glm-4': 'GLM-4',
        'glm-4-flash': 'GLM-4 Flash',
        'glm-4v-plus': 'GLM-4V Plus',
        'glm-4-air': 'GLM-4 Air'
    };
    
    // ---------- DOM REFS ----------
    const chat = document.getElementById('chatContainer');
    const prompt = document.getElementById('prompt');
    const sendBtn = document.getElementById('sendBtn');
    const modelSelect = document.getElementById('modelSelect');
    const memCount = document.getElementById('memCount');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const clearBtn = document.getElementById('clearMemBtn');
    const modeToggle = document.getElementById('modeToggle');
    const modeLabel = document.getElementById('modeLabel');
    const greetingMode = document.getElementById('greetingMode');
    const modelCount = document.getElementById('modelCount');
    const apiLabel = document.getElementById('apiLabel');
    const apiSelector = document.getElementById('apiSelector');
    
    // ---------- STATE ----------
    let currentMode = 'simple';
    let currentAPI = 'ppg';
    
    try {
        const m = localStorage.getItem('neuron_agi_mode');
        if (m === 'advance' || m === 'simple') currentMode = m;
    } catch(e) {}
    try {
        const a = localStorage.getItem('neuron_agi_api');
        if (a === 'ppg' || a === 'ppo' || a === 'ppl') currentAPI = a;
    } catch(e) {}
    
    // ---------- MEMORY ----------
    let memoryStore = [];
    try {
        const stored = localStorage.getItem('neuron_agi_memory_v7');
        if (stored) memoryStore = JSON.parse(stored);
        if (!Array.isArray(memoryStore)) memoryStore = [];
    } catch(e) { memoryStore = []; }
    
    // ---------- LOAD MODELS ----------
    function loadModelsForAPI(api) {
        const provider = API_PROVIDERS[api];
        if (!provider) return;
        
        modelSelect.innerHTML = '';
        const groups = {};
        
        provider.models.forEach(modelId => {
            const displayName = MODEL_LIST[modelId] || modelId;
            let providerName = api.toUpperCase();
            if (api === 'ppg') providerName = 'Google';
            else if (api === 'ppo') providerName = 'OpenRouter (Free)';
            else if (api === 'ppl') providerName = 'GLM';
            
            if (!groups[providerName]) groups[providerName] = [];
            groups[providerName].push({id: modelId, name: displayName});
        });
        
        if (provider.fallbackModels) {
            provider.fallbackModels.forEach(modelId => {
                if (!provider.models.includes(modelId)) {
                    const displayName = MODEL_LIST[modelId] || modelId;
                    const providerName = 'Auto-Fallback';
                    if (!groups[providerName]) groups[providerName] = [];
                    groups[providerName].push({id: modelId, name: displayName + ' ✓'});
                }
            });
        }
        
        const order = ['Google', 'OpenRouter (Free)', 'GLM', 'Auto-Fallback'];
        order.forEach(p => {
            if (groups[p] && groups[p].length) {
                const og = document.createElement('optgroup');
                og.label = p;
                groups[p].forEach(({id, name}) => {
                    const opt = document.createElement('option');
                    opt.value = id;
                    opt.textContent = name.length > 28 ? name.slice(0,26)+'…' : name;
                    og.appendChild(opt);
                });
                modelSelect.appendChild(og);
            }
        });
        
        if (modelSelect.options.length > 0) {
            modelSelect.selectedIndex = 0;
        }
        
        modelCount.textContent = `Model: ${modelSelect.options.length}`;
        apiLabel.innerHTML = `<i class="fas fa-key"></i> ${provider.label}`;
    }
    
    // ---------- UPDATE API SELECTION ----------
    function selectAPI(api) {
        currentAPI = api;
        localStorage.setItem('neuron_agi_api', api);
        
        document.querySelectorAll('#apiSelector button').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.api === api);
        });
        
        loadModelsForAPI(api);
    }
    
    // ---------- API SELECTOR EVENTS ----------
    apiSelector.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const api = btn.dataset.api;
        if (api === currentAPI) return;
        selectAPI(api);
        appendMessage('agi', `🔄 API পরিবর্তন: ${API_PROVIDERS[api].label}`, 'system');
    });
    
    // ---------- LOAD INITIAL ----------
    selectAPI(currentAPI);
    
    // ---------- MODE UI ----------
    function updateModeUI() {
        const btns = modeToggle.querySelectorAll('button');
        btns.forEach(b => b.classList.toggle('active', b.dataset.mode === currentMode));
        modeLabel.textContent = currentMode === 'advance' ? 'AGI' : 'সরল';
        if (greetingMode) greetingMode.textContent = currentMode === 'advance' ? 'AGI' : 'সরল';
        localStorage.setItem('neuron_agi_mode', currentMode);
    }
    updateModeUI();
    
    // ---------- MEMORY COUNTER ----------
    function updateMemCounter() {
        memCount.textContent = memoryStore.length;
        try { localStorage.setItem('neuron_agi_memory_v7', JSON.stringify(memoryStore)); } catch(e) {}
    }
    updateMemCounter();
    
    // ---------- VECTOR SEARCH ----------
    function vectorSearch(query, topK = 5) {
        if (!query || memoryStore.length === 0) return memoryStore.slice(-4);
        const words = query.toLowerCase().split(/\s+/).filter(w => w.length > 2);
        if (words.length === 0) return memoryStore.slice(-4);
        const scored = memoryStore.map((item, idx) => {
            const text = (item.content || '').toLowerCase();
            let score = 0;
            words.forEach(w => {
                if (text.includes(w)) score += 2 + (text.split(w).length - 1) * 0.7;
            });
            const age = (Date.now() - new Date(item.timestamp || 0).getTime()) / 86400000;
            score += Math.max(0, 1 - age / 30);
            return { idx, score, item };
        });
        scored.sort((a,b) => b.score - a.score);
        const top = scored.filter(s => s.score > 0.5).slice(0, topK);
        if (top.length === 0) return memoryStore.slice(-4);
        return top.map(s => s.item);
    }
    
    // ---------- RENDER MARKDOWN ----------
    function renderMarkdown(text) {
        if (!text) return '';
        let html = marked.parse(text);
        const temp = document.createElement('div');
        temp.innerHTML = html;
        temp.querySelectorAll('pre code').forEach(block => {
            hljs.highlightElement(block);
            const pre = block.parentElement;
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.innerHTML = '<i class="fas fa-copy"></i>';
            copyBtn.onclick = () => {
                navigator.clipboard?.writeText(block.textContent);
                copyBtn.innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => copyBtn.innerHTML = '<i class="fas fa-copy"></i>', 1500);
            };
            pre.style.position = 'relative';
            pre.appendChild(copyBtn);
        });
        return temp.innerHTML;
    }
    
    // ---------- APPEND MESSAGE ----------
    function appendMessage(role, content, modelUsed, fileInfo = null) {
        if (!content && !fileInfo) return;
        const entry = {
            role: role,
            content: content || '',
            model: modelUsed || modelSelect.value || 'unknown',
            timestamp: new Date().toISOString(),
            file: fileInfo ? { name: fileInfo.name, type: fileInfo.type } : null,
            mode: currentMode,
            api: currentAPI
        };
        memoryStore.push(entry);
        if (memoryStore.length > 800) memoryStore.shift();
        updateMemCounter();
        
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${role === 'user' ? 'user' : 'agi'}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        let displayContent = content || '';
        if (fileInfo) displayContent = '📎 ' + fileInfo.name + '\n' + displayContent;
        if (role === 'agi') bubble.innerHTML = renderMarkdown(displayContent);
        else bubble.textContent = displayContent;
        const meta = document.createElement('div');
        meta.className = 'msg-meta';
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.innerHTML = `<i class="fas fa-microchip"></i> ${modelUsed || modelSelect.value || 'unknown'}`;
        const time = document.createElement('span');
        time.textContent = new Date().toLocaleTimeString();
        meta.appendChild(tag);
        meta.appendChild(time);
        msgDiv.appendChild(bubble);
        msgDiv.appendChild(meta);
        chat.appendChild(msgDiv);
        chat.scrollTop = chat.scrollHeight;
        return msgDiv;
    }
    
    // ---------- TYPING ----------
    let typingTimeout = null;
    function showTyping() {
        hideTyping();
        const typing = document.createElement('div');
        typing.className = 'msg agi';
        typing.id = 'typingIndicator';
        typing.innerHTML = `<div class="bubble" style="background:#1a2838;border-color:#2f4459;">
            <div class="typing-indicator"><i class="fas fa-brain" style="color:#6fcf97;"></i> চিন্তা করছি 
            <span class="typing-dots"><span></span><span></span><span></span></span></div>
        </div>`;
        chat.appendChild(typing);
        chat.scrollTop = chat.scrollHeight;
        if (typingTimeout) clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => hideTyping(), 45000);
    }
    function hideTyping() {
        if (typingTimeout) { clearTimeout(typingTimeout); typingTimeout = null; }
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }
    
    // ---------- EXTRACT ZIP ----------
    async function extractZip(file) {
        try {
            const arrayBuffer = await file.arrayBuffer();
            const zip = await JSZip.loadAsync(arrayBuffer);
            let combined = '';
            const files = Object.keys(zip.files);
            for (const name of files) {
                const entry = zip.files[name];
                if (!entry.dir) {
                    try {
                        const content = await entry.async('string');
                        combined += `\n--- ${name} ---\n${content.slice(0, 2000)}\n`;
                    } catch(e) {}
                }
            }
            return combined.slice(0, 15000);
        } catch(e) { return '[ZIP extract error]'; }
    }
    
    // ---------- PROCESS FILE ----------
    async function processFile(file) {
        const name = file.name.toLowerCase();
        if (name.endsWith('.zip') || name.endsWith('.tar.gz') || name.endsWith('.tgz')) {
            const content = await extractZip(file);
            return { name: file.name, type: 'zip', content };
        } else {
            try {
                let text = await file.text();
                if (text.length > 15000) text = '...(ফাইল বড়, শেষ অংশ)...\n' + text.slice(-12000);
                return { name: file.name, type: file.type || 'text', content: text };
            } catch(e) {
                return { name: file.name, type: file.type, content: '[file read error]' };
            }
        }
    }
    
    // ---------- BUILD AGI CONTEXT ----------
    function buildAdvanceContext(userMessage, fileInfo) {
        const relevant = vectorSearch(userMessage, 5);
        let context = '';
        if (fileInfo) {
            if (fileInfo.type === 'zip') context += '📦 [ZIP আর্কাইভ] এক্সট্র্যাক্ট করা হয়েছে। ';
            else if (fileInfo.name.match(/\.(js|py|java|go|rs|c|cpp|rb|php)$/)) {
                context += '📄 [কোড ফাইল] আর্কিটেকচার বিশ্লেষণ: লেয়ার → মডিউল → ফাংশন। ';
            }
        }
        const topics = memoryStore.slice(-6).map(m => (m.content||'').substring(0, 40)).filter(Boolean);
        if (topics.length > 1) context += `🧠 [টপিক] ${topics.slice(-3).join(' | ')}. `;
        if (relevant.length) context += `🔍 [প্রাসঙ্গিক] ${relevant.map(r => (r.content||'').substring(0,40)).join(' | ')}. `;
        context += `মোট ${memoryStore.length}টি মেমরি।`;
        return context;
    }
    
    // ---------- CALL API (অটো-ফলব্যাক সহ) ----------
    async function callAPI(messages, model, stream = false) {
        const provider = API_PROVIDERS[currentAPI];
        if (!provider) throw new Error('Invalid API provider');
        
        const apiKey = provider.apiKey;
        const baseUrl = provider.baseUrl;
        
        if (currentAPI === 'ppg') {
            // Google Gemini API
            const modelName = model || 'gemini-3.5-flash';
            const url = `${baseUrl}/${modelName}:generateContent?key=${apiKey}`;
            const promptText = messages.map(m => `${m.role}: ${m.content}`).join('\n');
            
            // 2000 tokens-এ limit (402 error এড়াতে)
            const trimmedPrompt = promptText.length > 4000 ? promptText.slice(0, 4000) : promptText;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: trimmedPrompt }] }],
                    generationConfig: { temperature: 0.7, maxOutputTokens: 500 }
                })
            });
            
            if (!response.ok) {
                const errText = await response.text();
                for (const fallback of provider.fallbackModels) {
                    if (fallback === model) continue;
                    try {
                        const fbUrl = `${baseUrl}/${fallback}:generateContent?key=${apiKey}`;
                        const fbResp = await fetch(fbUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: trimmedPrompt }] }],
                                generationConfig: { temperature: 0.7, maxOutputTokens: 500 }
                            })
                        });
                        if (fbResp.ok) {
                            const data = await fbResp.json();
                            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'No response';
                            return { message: { content: text } };
                        }
                    } catch(e) {}
                }
                throw new Error(`Gemini error: ${response.status}`);
            }
            
            const data = await response.json();
            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'No response';
            return { message: { content: text } };
            
        } else if (currentAPI === 'ppo') {
            // OpenRouter API - শুধু ফ্রি মডেল
            const modelId = model || 'deepseek/deepseek-r1:free';
            
            // 500 tokens limit (402 error এড়াতে)
            const trimmedMessages = messages.map(m => ({
                role: m.role,
                content: m.content.length > 3000 ? m.content.slice(0, 3000) : m.content
            }));
            
            const response = await fetch(baseUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`,
                    'HTTP-Referer': window.location.origin || 'https://neuron-agi.app',
                    'X-Title': 'Neuron AGI'
                },
                body: JSON.stringify({
                    model: modelId,
                    messages: trimmedMessages,
                    stream: stream,
                    temperature: 0.7,
                    max_tokens: 500
                })
            });
            
            if (!response.ok) {
                const errText = await response.text();
                // Fallback মডেল try
                for (const fallback of provider.fallbackModels) {
                    if (fallback === modelId) continue;
                    try {
                        const fbResp = await fetch(baseUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiKey}`,
                                'HTTP-Referer': window.location.origin || 'https://neuron-agi.app',
                                'X-Title': 'Neuron AGI'
                            },
                            body: JSON.stringify({
                                model: fallback,
                                messages: trimmedMessages,
                                stream: stream,
                                temperature: 0.7,
                                max_tokens: 500
                            })
                        });
                        if (fbResp.ok) {
                            if (stream) return fbResp.body;
                            return await fbResp.json();
                        }
                    } catch(e) {}
                }
                throw new Error(`OpenRouter error: ${response.status}`);
            }
            
            if (stream) return response.body;
            return await response.json();
            
        } else if (currentAPI === 'ppl') {
            // GLM API - সব মডেল
            const modelId = model || 'glm-4';
            
            const trimmedMessages = messages.map(m => ({
                role: m.role,
                content: m.content.length > 3000 ? m.content.slice(0, 3000) : m.content
            }));
            
            const response = await fetch(baseUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: modelId,
                    messages: trimmedMessages,
                    stream: stream,
                    temperature: 0.7,
                    max_tokens: 500
                })
            });
            
            if (!response.ok) {
                const errText = await response.text();
                for (const fallback of provider.fallbackModels) {
                    if (fallback === modelId) continue;
                    try {
                        const fbResp = await fetch(baseUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiKey}`
                            },
                            body: JSON.stringify({
                                model: fallback,
                                messages: trimmedMessages,
                                stream: stream,
                                temperature: 0.7,
                                max_tokens: 500
                            })
                        });
                        if (fbResp.ok) {
                            if (stream) return fbResp.body;
                            return await fbResp.json();
                        }
                    } catch(e) {}
                }
                throw new Error(`GLM error: ${response.status}`);
            }
            
            if (stream) return response.body;
            return await response.json();
        }
        
        throw new Error('Unknown API provider');
    }
    
    // ---------- PROCESS STREAM ----------
    async function processStream(reader, bubble) {
        const decoder = new TextDecoder();
        let fullReply = '';
        let buffer = '';
        let hasContent = false;
        
        try {
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';
                
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const data = line.slice(6).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const json = JSON.parse(data);
                            const content = json?.choices?.[0]?.delta?.content || 
                                           json?.choices?.[0]?.message?.content || '';
                            if (content) {
                                fullReply += content;
                                hasContent = true;
                                bubble.innerHTML = renderMarkdown(fullReply);
                                chat.scrollTop = chat.scrollHeight;
                            }
                        } catch(e) {}
                    }
                }
            }
        } catch(streamError) {
            console.warn('Stream read error:', streamError);
        }
        
        return { fullReply, hasContent };
    }
    
    // ---------- SEND MESSAGE ----------
    async function handleSend() {
        let userText = prompt.value.trim();
        let fileObj = null;
        
        if (fileInput.files.length > 0) {
            const f = fileInput.files[0];
            const processed = await processFile(f);
            fileObj = processed;
            if (userText) userText += '\n\n' + processed.content;
            else userText = processed.content;
            fileName.textContent = f.name.length > 22 ? f.name.slice(0,20)+'…' : f.name;
            fileInput.value = '';
        }
        
        if (!userText) {
            if (!fileObj) return;
            if (fileObj) userText = fileObj.content || '[file]';
            else return;
        }
        
        const model = modelSelect.value || 'gpt-4o';
        appendMessage('user', userText, model, fileObj);
        prompt.value = '';
        if (!fileInput.files.length) fileName.textContent = 'কোন ফাইল নেই';
        
        let agiContext = '';
        let systemPrompt = 'You are a helpful AI assistant. Provide clear, structured responses. Use markdown for formatting. Keep responses concise.';
        if (currentMode === 'advance') {
            agiContext = buildAdvanceContext(userText, fileObj);
            systemPrompt = `You are Neuron AGI with advanced memory & reasoning. Context: ${agiContext}. 
            Provide structured, layered answers. For code, give step-by-step plans with architecture layers.
            Use markdown for formatting. Keep responses concise.`;
        }
        
        const recentMem = memoryStore.slice(-6).map(m => `${m.role}: ${(m.content||'').substring(0,200)}`).join('\n');
        const fullPrompt = `[মেমরি]\n${recentMem}\n\n${currentMode === 'advance' ? '[AGI প্ল্যান] '+agiContext : ''}\n\nব্যবহারকারী: ${userText}\n\nউত্তর:`;
        
        const messages = [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: fullPrompt }
        ];
        
        showTyping();
        
        try {
            const canStream = currentAPI === 'ppo' || currentAPI === 'ppl';
            
            if (canStream) {
                const response = await callAPI(messages, model, true);
                
                if (response && typeof response === 'object' && response.body) {
                    const reader = response.body.getReader();
                    hideTyping();
                    
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'msg agi';
                    const bubble = document.createElement('div');
                    bubble.className = 'bubble';
                    const meta = document.createElement('div');
                    meta.className = 'msg-meta';
                    const tag = document.createElement('span');
                    tag.className = 'tag';
                    tag.innerHTML = `<i class="fas fa-microchip"></i> ${model}`;
                    const time = document.createElement('span');
                    time.textContent = new Date().toLocaleTimeString();
                    meta.appendChild(tag);
                    meta.appendChild(time);
                    msgDiv.appendChild(bubble);
                    msgDiv.appendChild(meta);
                    chat.appendChild(msgDiv);
                    
                    const streamPromise = processStream(reader, bubble);
                    const timeoutPromise = new Promise((_, reject) => {
                        setTimeout(() => reject(new Error('Stream timeout')), 60000);
                    });
                    
                    const { fullReply, hasContent } = await Promise.race([streamPromise, timeoutPromise]);
                    
                    if (!fullReply || !hasContent) {
                        const fallback = await callAPI(messages, model, false);
                        let reply = fallback?.message?.content || fallback?.choices?.[0]?.message?.content || 'No response';
                        if (typeof reply === 'object') reply = JSON.stringify(reply);
                        bubble.innerHTML = renderMarkdown(reply);
                        const entry = { role: 'agi', content: reply, model, timestamp: new Date().toISOString(), file: null, mode: currentMode };
                        memoryStore.push(entry);
                        if (memoryStore.length > 800) memoryStore.shift();
                        updateMemCounter();
                    } else {
                        const entry = { role: 'agi', content: fullReply, model, timestamp: new Date().toISOString(), file: null, mode: currentMode };
                        memoryStore.push(entry);
                        if (memoryStore.length > 800) memoryStore.shift();
                        updateMemCounter();
                    }
                } else {
                    hideTyping();
                    const data = await callAPI(messages, model, false);
                    let reply = data?.message?.content || data?.choices?.[0]?.message?.content || 'No response';
                    if (typeof reply === 'object') reply = JSON.stringify(reply);
                    appendMessage('agi', reply, model);
                }
            } else {
                hideTyping();
                const data = await callAPI(messages, model, false);
                let reply = data?.message?.content || 'No response';
                if (typeof reply === 'object') reply = JSON.stringify(reply);
                appendMessage('agi', reply, model);
            }
            
        } catch(err) {
            hideTyping();
            console.error('Error:', err);
            
            // Fallback: try another model
            try {
                const fallbackModels = ['deepseek/deepseek-r1:free', 'meta-llama/llama-3.3-70b-instruct:free', 'glm-4'];
                let fallbackReply = null;
                for (const fbModel of fallbackModels) {
                    if (fbModel === model) continue;
                    try {
                        const fbResp = await callAPI(messages, fbModel, false);
                        const reply = fbResp?.message?.content || fbResp?.choices?.[0]?.message?.content;
                        if (reply) {
                            fallbackReply = reply;
                            break;
                        }
                    } catch(e) {}
                }
                if (fallbackReply) {
                    appendMessage('agi', fallbackReply, 'auto-fallback');
                } else {
                    appendMessage('agi', `⚠️ ত্রুটি: ${err.message || 'API সংযোগ সমস্যা'}`, model);
                }
            } catch(e2) {
                appendMessage('agi', `⚠️ ত্রুটি: ${err.message || 'সব API ব্যর্থ'}`, model);
            }
        }
    }
    
    // ---------- MODE TOGGLE ----------
    modeToggle.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const mode = btn.dataset.mode;
        if (mode === currentMode) return;
        currentMode = mode;
        updateModeUI();
        appendMessage('agi', `🔄 মোড: ${currentMode === 'advance' ? 'AGI অ্যাডভান্স' : 'সরল'} সক্রিয়।`, 'system');
    });
    
    // ---------- CLEAR ----------
    clearBtn.addEventListener('click', () => {
        memoryStore = [];
        updateMemCounter();
        chat.innerHTML = '';
        const welcome = document.createElement('div');
        welcome.className = 'msg agi';
        welcome.innerHTML = `<div class="bubble"><i class="fas fa-brain" style="color:#6fcf97;margin-right:6px;"></i> মেমরি রিসেট। Neuron AGI পুনরায় চালু।</div>
        <div class="msg-meta"><span class="tag">system</span><span>now</span></div>`;
        chat.appendChild(welcome);
    });
    
    // ---------- EVENTS ----------
    sendBtn.addEventListener('click', handleSend);
    prompt.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });
    prompt.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });
    fileInput.addEventListener('change', function() {
        if (this.files.length > 0) {
            fileName.textContent = this.files[0].name.length > 24 ? this.files[0].name.slice(0,22)+'…' : this.files[0].name;
        } else {
            fileName.textContent = 'কোন ফাইল নেই';
        }
    });
    
    updateMemCounter();
    console.log('✅ Neuron AGI - Free models only, auto-fallback, no Claude/GPT paid models');
})();
