<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Neuron AI · WhatsApp</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background:#0a0f15; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:8px; }
        .app { max-width:480px; width:100%; background:#0d1a1f; border-radius:28px; border:1px solid #1e3a42; height:94vh; display:flex; flex-direction:column; overflow:hidden; position:relative; }
        .chat-bg { position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; background-size:cover; background-position:center; opacity:0.12; pointer-events:none; }
        .chat-bg.default { background: radial-gradient(ellipse at center, #0d2b33 0%, #061014 100%); }
        .header { padding:10px 14px 8px; background:rgba(13,26,31,0.92); backdrop-filter:blur(12px); border-bottom:1px solid #1e3a42; display:flex; align-items:center; gap:10px; z-index:1; position:relative; }
        .header .back { color:#7bc8d4; font-size:1.2rem; cursor:pointer; }
        .header .dp { width:42px; height:42px; border-radius:50%; background:#1e3a42; overflow:hidden; border:2px solid #2a5a66; flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .header .dp img { width:100%; height:100%; object-fit:cover; }
        .header .dp i { font-size:1.2rem; color:#5a8a96; }
        .header .info { flex:1; }
        .header .info .name { color:#e8f0f3; font-size:1rem; font-weight:600; }
        .header .info .status { color:#7bc8d4; font-size:0.6rem; display:flex; align-items:center; gap:4px; }
        .header .info .status .dot { width:6px; height:6px; border-radius:50%; background:#4cdb7b; display:inline-block; }
        .header .actions { display:flex; gap:12px; color:#7bc8d4; font-size:1.1rem; }
        .header .actions span { cursor:pointer; }
        .chat { flex:1; overflow-y:auto; padding:10px 12px 4px; display:flex; flex-direction:column; gap:4px; background:transparent; scroll-behavior:smooth; z-index:1; position:relative; }
        .msg { display:flex; flex-direction:column; max-width:88%; animation:fadeUp 0.2s ease; }
        .msg.user { align-self:flex-end; }
        .msg.agi { align-self:flex-start; }
        .bubble { padding:8px 12px; border-radius:16px; background:#1a2f36; color:#e0edf3; word-wrap:break-word; line-height:1.6; font-size:0.9rem; border:1px solid #1e3a42; white-space:pre-wrap; }
        .msg.user .bubble { background:#1a5a6a; border-color:#2a7a8a; color:#fff; border-bottom-right-radius:4px; }
        .msg.agi .bubble { background:#14242a; border-bottom-left-radius:4px; border-color:#1a3a42; }
        .bubble.system { background:#1a2a30; border-color:#1a3a42; color:#7bc8d4; font-style:italic; font-size:0.78rem; text-align:center; }
        .msg .time { font-size:0.45rem; color:#5a8a96; padding:1px 6px 0; text-align:right; }
        .msg.user .time { color:#6a9aaa; }
        .bubble pre { background:#0d1a1f; border-radius:8px; padding:6px; margin:3px 0; overflow-x:auto; border:1px solid #1a3a42; }
        .bubble code { font-family:'Fira Code', monospace; font-size:0.78rem; }
        .bubble h1,.bubble h2,.bubble h3 { color:#b0dbe8; margin:3px 0 2px; font-size:0.9rem; }
        .bubble ul,.bubble ol { padding-left:14px; margin:2px 0; }
        .bubble p { margin:2px 0; }
        .input-area { padding:6px 10px 10px; background:rgba(13,26,31,0.92); backdrop-filter:blur(12px); border-top:1px solid #1e3a42; z-index:1; position:relative; }
        .input-row { display:flex; gap:4px; align-items:flex-end; background:#1a2f36; border-radius:24px; padding:3px 3px 3px 12px; border:1px solid #1e3a42; }
        .input-row textarea { flex:1; background:transparent; border:none; padding:6px 2px; color:#e8f0f3; font-size:0.9rem; resize:none; outline:none; min-height:36px; max-height:80px; line-height:1.4; }
        .input-row textarea::placeholder { color:#5a8a96; }
        .input-row .attach-btn { color:#5a8a96; font-size:1rem; cursor:pointer; padding:2px 4px; }
        .input-row .send-btn { background:#2a5a66; border:none; border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:0.9rem; cursor:pointer; }
        .input-row .send-btn:active { transform:scale(0.92); }
        .bottom-bar { display:flex; justify-content:space-between; align-items:center; padding:2px 4px 0; gap:4px; flex-wrap:wrap; }
        .api-selector { display:flex; gap:4px; flex-wrap:wrap; }
        .api-selector button { background:transparent; border:1px solid #1e3a42; color:#5a8a96; padding:1px 8px; border-radius:30px; font-size:0.5rem; cursor:pointer; transition:0.15s; }
        .api-selector button.active { background:#1a5a6a; border-color:#2a7a8a; color:#fff; }
        .model-badge { color:#5a8a96; font-size:0.45rem; background:#1a2f36; padding:1px 8px; border-radius:30px; border:1px solid #1a3a42; max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
        .file-name { color:#5a8a96; font-size:0.5rem; max-width:60px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .clear-mem { background:transparent; border:none; color:#5a8a96; font-size:0.5rem; cursor:pointer; }
        .typing-indicator { display:flex; align-items:center; gap:4px; padding:2px 10px; color:#5a8a96; font-size:0.65rem; }
        .typing-dots span { display:inline-block; width:4px; height:4px; background:#7bc8d4; border-radius:50%; margin:0 1px; animation:typingBounce 1.2s infinite; }
        .typing-dots span:nth-child(2) { animation-delay:0.2s; }
        .typing-dots span:nth-child(3) { animation-delay:0.4s; }
        @keyframes typingBounce { 0%,60%,100%{transform:translateY(0);opacity:0.4;} 30%{transform:translateY(-4px);opacity:1;} }
        @keyframes fadeUp { from{opacity:0.3;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
        .chat::-webkit-scrollbar { width:3px; }
        .chat::-webkit-scrollbar-track { background:transparent; }
        .chat::-webkit-scrollbar-thumb { background:#1e3a42; border-radius:20px; }
        .copy-btn { background:#1a3a42; border:none; color:#7a9aaa; padding:1px 6px; border-radius:20px; font-size:0.45rem; cursor:pointer; float:right; margin:2px 0 0 4px; }
        .hljs { background:#0d1a1f !important; border-radius:4px; }
        .attach-bar { display:flex; gap:4px; align-items:center; padding:1px 4px; flex-wrap:wrap; }
        .attach-bar label { color:#5a8a96; font-size:0.5rem; cursor:pointer; }
        .attach-bar input[type="file"] { display:none; }
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:100; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
        .modal { background:#1a2f36; border-radius:24px; padding:20px; max-width:360px; width:90%; border:1px solid #2a5a66; }
        .modal h3 { color:#e8f0f3; margin-bottom:12px; text-align:center; font-size:1rem; }
        .modal .preview { display:flex; gap:16px; justify-content:center; align-items:center; margin-bottom:12px; }
        .modal .preview .dp-preview { width:60px; height:60px; border-radius:50%; background:#1e3a42; overflow:hidden; border:2px solid #2a5a66; display:flex; align-items:center; justify-content:center; font-size:2rem; color:#5a8a96; }
        .modal .preview .bg-preview { width:90px; height:60px; border-radius:12px; background:#0d2b33; overflow:hidden; border:1px solid #1e3a42; display:flex; align-items:center; justify-content:center; font-size:0.5rem; color:#5a8a96; }
        .modal .btn-group { display:flex; flex-direction:column; gap:6px; }
        .modal .btn-group label { background:#1e3a42; color:#b0dbe8; padding:6px 10px; border-radius:30px; text-align:center; font-size:0.75rem; cursor:pointer; border:1px solid #2a5a66; }
        .modal .btn-group input[type="file"] { display:none; }
        .modal .btn-group input[type="text"] { background:#0d2b33; border:1px solid #1e3a42; border-radius:30px; padding:6px 14px; color:#e8f0f3; outline:none; font-size:0.8rem; }
        .modal .btn-save { background:#2a5a66; color:#e8f0f3; border:none; padding:6px; border-radius:30px; margin-top:8px; font-size:0.8rem; cursor:pointer; width:100%; }
        .modal .btn-close { background:#2a4a56; color:#e8f0f3; border:none; padding:6px; border-radius:30px; margin-top:4px; font-size:0.8rem; cursor:pointer; width:100%; }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="chat-bg default" id="chatBg"></div>
    
    <!-- Header -->
    <div class="header">
        <div class="back" id="backBtn"><i class="fas fa-chevron-left"></i></div>
        <div class="dp" id="profileDp" onclick="document.getElementById('dpInput').click()">
            <img id="dpImage" src="" style="display:none;">
            <i id="dpIcon" class="fas fa-robot"></i>
        </div>
        <input type="file" id="dpInput" accept="image/*" style="display:none;">
        <div class="info">
            <div class="name" id="botName">Neuron AI</div>
            <div class="status"><span class="dot"></span> <span id="statusText">অনলাইন</span></div>
        </div>
        <div class="actions">
            <span onclick="document.getElementById('bgInput').click()"><i class="fas fa-image"></i></span>
            <span onclick="toggleModal()"><i class="fas fa-ellipsis-v"></i></span>
        </div>
    </div>
    <input type="file" id="bgInput" accept="image/*" style="display:none;">
    
    <!-- Profile Modal -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal">
            <h3><i class="fas fa-robot"></i> প্রোফাইল সেটিং</h3>
            <div class="preview">
                <div class="dp-preview" id="dpPreview"><i class="fas fa-robot"></i></div>
                <div class="bg-preview" id="bgPreview">Background</div>
            </div>
            <div class="btn-group">
                <label for="dpModalInput"><i class="fas fa-user-circle"></i> প্রোফাইল ছবি</label>
                <input type="file" id="dpModalInput" accept="image/*">
                <label for="bgModalInput"><i class="fas fa-image"></i> ব্যাকগ্রাউন্ড</label>
                <input type="file" id="bgModalInput" accept="image/*">
                <input type="text" id="nameInput" value="Neuron AI">
            </div>
            <button class="btn-save" onclick="saveProfile()"><i class="fas fa-check"></i> সংরক্ষণ</button>
            <button class="btn-close" onclick="toggleModal()">বন্ধ</button>
        </div>
    </div>
    
    <!-- Chat -->
    <div class="chat" id="chatContainer">
        <div class="msg agi">
            <div class="bubble"><i class="fas fa-robot" style="color:#7bc8d4;margin-right:6px;"></i> 👋 হ্যালো! আমি Neuron AI।<br><br>📌 <b>কমান্ড:</b><br><code>/models</code> - মডেল লিস্ট দেখুন<br><code>/model [নাম]</code> - মডেল পরিবর্তন করুন<br><br>🔹 বর্তমান API: <b>PPG</b></div>
            <div class="time">now</div>
        </div>
    </div>
    
    <!-- Input -->
    <div class="input-area">
        <div class="input-row">
            <textarea id="prompt" rows="1" placeholder="মেসেজ লিখুন..."></textarea>
            <span class="attach-btn" id="attachBtn"><i class="fas fa-paperclip"></i></span>
            <input type="file" id="fileInput" accept=".txt,.js,.py,.html,.css,.json,.md,.csv,.xml,.yml,.java,.c,.cpp,.go,.rs,.sh,.rb,.php,.zip" style="display:none;">
            <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
        <div class="bottom-bar">
            <div class="api-selector" id="apiSelector">
                <button class="active" data-api="ppg">PPG</button>
                <button data-api="ppo">PPO</button>
                <button data-api="groq">Groq</button>
                <button data-api="github">GitHub</button>
            </div>
            <span class="model-badge" id="modelBadge" onclick="showModelHelp()">🧠 auto</span>
            <span class="clear-mem" id="clearMemBtn"><i class="fas fa-eraser"></i></span>
        </div>
        <div class="attach-bar">
            <span class="file-name" id="fileName"></span>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
    // ---------- API KEYS ----------
    const ENCRYPTED_KEYS = {
        openrouter: 'c2stb3ItdjEtOGRiZWYxYmRjYjJmOTA4N2IzMDQ1NjY2ZTg1YjI5MmY4MDllZGUwNDBiNGMyYTNiMTkxNGIwNDNlYThhMTA3ZQ==',
        gemini: 'QVEuQWI4Uk42S0JwWWVYeFBRU25hUnJTZERSa2RvSFlqRGNpNkthRVZBR1ZIQ3ZFV18wWVE=',
        groq: 'Z3JrX2d6cGZFSVZiY1pLT0xLNXpuT3pibE9reFNZcTVYRVc5NENWWQ==',
        github: 'Z2hfdWZIV2R2OFdCblRSZkZ1b1lwYTRUcGdVZkJhRlFJY3E2N2xvSA=='
    };
    function decodeKey(e) { try { return atob(e); } catch(e) { return ''; } }
    const OPENROUTER_KEY = decodeKey(ENCRYPTED_KEYS.openrouter);
    const GEMINI_KEY = decodeKey(ENCRYPTED_KEYS.gemini);
    const GROQ_KEY = decodeKey(ENCRYPTED_KEYS.groq);
    const GITHUB_KEY = decodeKey(ENCRYPTED_KEYS.github);
    
    // ---------- MODEL CONFIG ----------
    const MODEL_CONFIG = {
        'ppg': {
            label: 'PPG',
            apiKey: GEMINI_KEY,
            baseUrl: 'https://generativelanguage.googleapis.com/v1beta/models',
            models: ['gemini-3.5-flash', 'gemini-3.1-flash-lite', 'gemma-4-31b-it', 'gemini-3.6-flash'],
            fallback: ['gemini-3.5-flash', 'gemini-3.1-flash-lite'],
            type: 'gemini'
        },
        'ppo': {
            label: 'PPO',
            apiKey: OPENROUTER_KEY,
            baseUrl: 'https://openrouter.ai/api/v1/chat/completions',
            models: ['deepseek/deepseek-r1:free', 'meta-llama/llama-3.3-70b-instruct:free', 'mistralai/mistral-7b-instruct:free', 'qwen/qwen-2.5-coder-32b-instruct:free', 'openrouter/free'],
            fallback: ['openrouter/free', 'deepseek/deepseek-r1:free'],
            type: 'openrouter'
        },
        'groq': {
            label: 'Groq',
            apiKey: GROQ_KEY,
            baseUrl: 'https://api.groq.com/openai/v1/chat/completions',
            models: ['llama-3.3-70b-versatile', 'llama-4-8b', 'qwen3-32b', 'gpt-oss-120b'],
            fallback: ['llama-3.3-70b-versatile', 'qwen3-32b'],
            type: 'groq'
        },
        'github': {
            label: 'GitHub',
            apiKey: GITHUB_KEY,
            baseUrl: 'https://models.github.ai/inference/v1/chat/completions',
            models: ['gpt-5', 'gpt-4.1', 'gpt-4o', 'o4-mini', 'deepseek-r1', 'llama-4'],
            fallback: ['gpt-4o', 'deepseek-r1'],
            type: 'github'
        }
    };
    
    // ---------- DOM ----------
    const chat = document.getElementById('chatContainer');
    const prompt = document.getElementById('prompt');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const clearBtn = document.getElementById('clearMemBtn');
    const apiSelector = document.getElementById('apiSelector');
    const modelBadge = document.getElementById('modelBadge');
    const chatBg = document.getElementById('chatBg');
    const dpImage = document.getElementById('dpImage');
    const dpIcon = document.getElementById('dpIcon');
    const botName = document.getElementById('botName');
    const attachBtn = document.getElementById('attachBtn');
    const statusText = document.getElementById('statusText');
    
    // ---------- STATE ----------
    let currentAPI = 'ppg';
    let currentModel = 'auto';
    let isProcessing = false;
    let memoryStore = [];
    let botProfile = { name: 'Neuron AI', dp: '', bg: '' };
    let fallbackChain = [];
    
    // Load from localStorage
    try {
        const a = localStorage.getItem('neuron_agi_api');
        if (a && MODEL_CONFIG[a]) currentAPI = a;
        const m = localStorage.getItem('neuron_agi_model');
        if (m) currentModel = m;
    } catch(e) {}
    try {
        const p = localStorage.getItem('neuron_bot_profile');
        if (p) botProfile = JSON.parse(p);
        if (botProfile.dp) { dpImage.src = botProfile.dp; dpImage.style.display = 'block'; dpIcon.style.display = 'none'; }
        if (botProfile.bg) { chatBg.style.backgroundImage = `url(${botProfile.bg})`; chatBg.className = 'chat-bg'; }
        if (botProfile.name) botName.textContent = botProfile.name;
    } catch(e) {}
    try {
        const stored = localStorage.getItem('neuron_agi_memory_v11');
        if (stored) memoryStore = JSON.parse(stored);
        if (!Array.isArray(memoryStore)) memoryStore = [];
    } catch(e) { memoryStore = []; }
    
    // ---------- MODEL HELP ----------
    function showModelHelp() {
        const provider = MODEL_CONFIG[currentAPI];
        const models = provider ? provider.models : [];
        const msg = `📋 **বর্তমান API:** ${currentAPI.toUpperCase()}\n**মডেল:** ${currentModel}\n\n**উপলব্ধ মডেল:**\n${models.map(m => `• \`${m}\``).join('\n')}\n\n📌 **মডেল পরিবর্তন:**\n\`/model [নাম]\`\n\n🔹 **অটো মডেল:** \`/model auto\``;
        appendMessage('agi', msg);
    }
    
    // ---------- SET MODEL ----------
    function setModelFromChat(text) {
        const match = text.match(/\/model\s+(.+)/i);
        if (!match) return false;
        const modelName = match[1].trim();
        const provider = MODEL_CONFIG[currentAPI];
        if (!provider) return false;
        
        if (modelName.toLowerCase() === 'auto') {
            currentModel = 'auto';
            localStorage.setItem('neuron_agi_model', 'auto');
            modelBadge.textContent = '🧠 auto';
            appendMessage('agi', `✅ অটো-মোড সক্রিয়।`);
            return true;
        }
        
        const exists = provider.models.some(m => m.toLowerCase() === modelName.toLowerCase());
        if (exists) {
            currentModel = modelName;
            localStorage.setItem('neuron_agi_model', modelName);
            modelBadge.textContent = `🧠 ${modelName.length > 12 ? modelName.slice(0,10)+'…' : modelName}`;
            appendMessage('agi', `✅ মডেল পরিবর্তন: \`${modelName}\``);
            return true;
        } else {
            appendMessage('agi', `❌ মডেল পাওয়া যায়নি: \`${modelName}\`\n\nউপলব্ধ:\n${provider.models.map(m => `• \`${m}\``).join('\n')}`);
            return true;
        }
    }
    
    // ---------- API SELECTOR ----------
    function selectAPI(api) {
        currentAPI = api;
        localStorage.setItem('neuron_agi_api', api);
        document.querySelectorAll('#apiSelector button').forEach(b => {
            b.classList.toggle('active', b.dataset.api === api);
        });
        currentModel = 'auto';
        localStorage.setItem('neuron_agi_model', 'auto');
        modelBadge.textContent = '🧠 auto';
        const provider = MODEL_CONFIG[api];
        fallbackChain = provider ? provider.fallback : [];
        statusText.textContent = `API: ${api.toUpperCase()}`;
        appendMessage('agi', `🔄 API পরিবর্তন: **${api.toUpperCase()}**`);
    }
    apiSelector.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const api = btn.dataset.api;
        if (api === currentAPI) return;
        selectAPI(api);
    });
    
    // ---------- MEMORY ----------
    function updateMemCounter() {
        try { localStorage.setItem('neuron_agi_memory_v11', JSON.stringify(memoryStore)); } catch(e) {}
    }
    
    // ---------- VECTOR SEARCH ----------
    function vectorSearch(query, topK = 4) {
        if (!query || memoryStore.length === 0) return memoryStore.slice(-3);
        const words = query.toLowerCase().split(/\s+/).filter(w => w.length > 2);
        if (words.length === 0) return memoryStore.slice(-3);
        const scored = memoryStore.map((item, idx) => {
            const text = (item.content || '').toLowerCase();
            let score = 0;
            words.forEach(w => { if (text.includes(w)) score += 2 + (text.split(w).length - 1) * 0.5; });
            const age = (Date.now() - new Date(item.timestamp || 0).getTime()) / 86400000;
            score += Math.max(0, 1 - age / 20);
            return { idx, score, item };
        });
        scored.sort((a,b) => b.score - a.score);
        const top = scored.filter(s => s.score > 0.2).slice(0, topK);
        if (top.length === 0) return memoryStore.slice(-3);
        return top.map(s => s.item);
    }
    
    // ---------- RENDER ----------
    function renderMarkdown(text) {
        if (!text) return text;
        try {
            let html = marked.parse(text);
            const temp = document.createElement('div');
            temp.innerHTML = html;
            temp.querySelectorAll('pre code').forEach(block => {
                try { hljs.highlightElement(block); } catch(e) {}
                const pre = block.parentElement;
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerHTML = '<i class="fas fa-copy"></i>';
                copyBtn.onclick = () => {
                    navigator.clipboard?.writeText(block.textContent);
                    copyBtn.innerHTML = '<i class="fas fa-check"></i>';
                    setTimeout(() => copyBtn.innerHTML = '<i class="fas fa-copy"></i>', 1500);
                };
                pre.style.position = 'relative';
                pre.appendChild(copyBtn);
            });
            return temp.innerHTML;
        } catch(e) { return text; }
    }
    
    // ---------- APPEND MESSAGE ----------
    function appendMessage(role, content, modelUsed = '') {
        if (!content) return;
        const entry = {
            role: role,
            content: content,
            timestamp: new Date().toISOString()
        };
        memoryStore.push(entry);
        if (memoryStore.length > 400) memoryStore.shift();
        updateMemCounter();
        
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${role === 'user' ? 'user' : 'agi'}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (role === 'system') bubble.classList.add('system');
        if (role === 'agi') bubble.innerHTML = renderMarkdown(content);
        else bubble.textContent = content;
        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        msgDiv.appendChild(bubble);
        msgDiv.appendChild(time);
        chat.appendChild(msgDiv);
        chat.scrollTop = chat.scrollHeight;
        return msgDiv;
    }

    // ---------- FILE ----------
    async function processFile(file) {
        const name = file.name.toLowerCase();
        if (name.endsWith('.zip') || name.endsWith('.tar.gz')) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const zip = await JSZip.loadAsync(arrayBuffer);
                let combined = '';
                for (const fname of Object.keys(zip.files)) {
                    const entry = zip.files[fname];
                    if (!entry.dir) {
                        try {
                            const content = await entry.async('string');
                            combined += `\n--- ${fname} ---\n${content.slice(0, 1200)}\n`;
                        } catch(e) {}
                    }
                }
                return { name: file.name, content: combined.slice(0, 8000) };
            } catch(e) { return { name: file.name, content: '[ZIP error]' }; }
        } else {
            try {
                let text = await file.text();
                if (text.length > 8000) text = '...(বড় ফাইল)...\n' + text.slice(-6000);
                return { name: file.name, content: text };
            } catch(e) { return { name: file.name, content: '[read error]' }; }
        }
    }
    
    // ---------- CALL API ----------
    async function callAPI(messages, model, stream = false) {
        const provider = MODEL_CONFIG[currentAPI];
        if (!provider) throw new Error('Invalid API');
        
        const apiKey = provider.apiKey;
        const baseUrl = provider.baseUrl;
        const type = provider.type;
        
        let modelId = model || currentModel || 'auto';
        if (modelId === 'auto') {
            modelId = provider.models[0] || provider.fallback[0] || 'auto';
        }
        
        const modelExists = provider.models.some(m => m === modelId);
        if (!modelExists && modelId !== 'auto') {
            for (const fb of provider.fallback) {
                try { modelId = fb; break; } catch(e) {}
            }
        }
        
        const trimmedMessages = messages.map(m => ({
            role: m.role,
            content: m.content.length > 2500 ? m.content.slice(0, 2500) : m.content
        }));
        
        if (type === 'gemini') {
            const url = `${baseUrl}/${modelId}:generateContent?key=${apiKey}`;
            const promptText = trimmedMessages.map(m => `${m.role}: ${m.content}`).join('\n');
            const trimmed = promptText.length > 4000 ? promptText.slice(0, 4000) : promptText;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: trimmed }] }],
                    generationConfig: { temperature: 0.7, maxOutputTokens: 500 }
                })
            });
            if (!response.ok) {
                for (const fb of provider.fallback) {
                    if (fb === modelId) continue;
                    try {
                        const fbUrl = `${baseUrl}/${fb}:generateContent?key=${apiKey}`;
                        const fbResp = await fetch(fbUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: trimmed }] }],
                                generationConfig: { temperature: 0.7, maxOutputTokens: 500 }
                            })
                        });
                        if (fbResp.ok) {
                            const data = await fbResp.json();
                            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'No response';
                            return { message: { content: text }, model: fb };
                        }
                    } catch(e) {}
                }
                throw new Error(`API error: ${response.status}`);
            }
            const data = await response.json();
            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'No response';
            return { message: { content: text }, model: modelId };
            
        } else if (type === 'openrouter') {
            const response = await fetch(baseUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`,
                    'HTTP-Referer': window.location.origin || 'https://neuron-agi.app',
                    'X-Title': 'Neuron AI'
                },
                body: JSON.stringify({
                    model: modelId,
                    messages: trimmedMessages,
                    stream: stream,
                    temperature: 0.7,
                    max_tokens: 500
                })
            });
            if (!response.ok) {
                for (const fb of provider.fallback) {
                    if (fb === modelId) continue;
                    try {
                        const fbResp = await fetch(baseUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiKey}`,
                                'HTTP-Referer': window.location.origin || 'https://neuron-agi.app',
                                'X-Title': 'Neuron AI'
                            },
                            body: JSON.stringify({
                                model: fb,
                                messages: trimmedMessages,
                                stream: stream,
                                temperature: 0.7,
                                max_tokens: 500
                            })
                        });
                        if (fbResp.ok) {
                            if (stream) return { body: fbResp.body, model: fb };
                            const data = await fbResp.json();
                            return { message: data, model: fb };
                        }
                    } catch(e) {}
                }
                throw new Error(`API error: ${response.status}`);
            }
            if (stream) return { body: response.body, model: modelId };
            const data = await response.json();
            return { message: data, model: modelId };
            
        } else if (type === 'groq') {
            const response = await fetch(baseUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: modelId,
                    messages: trimmedMessages,
                    stream: stream,
                    temperature: 0.7,
                    max_tokens: 500
                })
            });
            if (!response.ok) {
                for (const fb of provider.fallback) {
                    if (fb === modelId) continue;
                    try {
                        const fbResp = await fetch(baseUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiKey}`
                            },
                            body: JSON.stringify({
                                model: fb,
                                messages: trimmedMessages,
                                stream: stream,
                                temperature: 0.7,
                                max_tokens: 500
                            })
                        });
                        if (fbResp.ok) {
                            if (stream) return { body: fbResp.body, model: fb };
                            const data = await fbResp.json();
                            return { message: data, model: fb };
                        }
                    } catch(e) {}
                }
                throw new Error(`Groq error: ${response.status}`);
            }
            if (stream) return { body: response.body, model: modelId };
            const data = await response.json();
            return { message: data, model: modelId };
            
        } else if (type === 'github') {
            const response = await fetch(baseUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: modelId,
                    messages: trimmedMessages,
                    stream: stream,
                    temperature: 0.7,
                    max_tokens: 500
                })
            });
            if (!response.ok) {
                for (const fb of provider.fallback) {
                    if (fb === modelId) continue;
                    try {
                        const fbResp = await fetch(baseUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiKey}`
                            },
                            body: JSON.stringify({
                                model: fb,
                                messages: trimmedMessages,
                                stream: stream,
                                temperature: 0.7,
                                max_tokens: 500
                            })
                        });
                        if (fbResp.ok) {
                            if (stream) return { body: fbResp.body, model: fb };
                            const data = await fbResp.json();
                            return { message: data, model: fb };
                        }
                    } catch(e) {}
                }
                throw new Error(`GitHub error: ${response.status}`);
            }
            if (stream) return { body: response.body, model: modelId };
            const data = await response.json();
            return { message: data, model: modelId };
        }
        throw new Error('Unknown API type');
    }
    
    // ---------- STREAM ----------
    async function processStream(reader, bubble) {
        const decoder = new TextDecoder();
        let fullReply = '';
        let buffer = '';
        let hasContent = false;
        try {
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const data = line.slice(6).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const json = JSON.parse(data);
                            const content = json?.choices?.[0]?.delta?.content || json?.choices?.[0]?.message?.content || '';
                            if (content) {
                                fullReply += content;
                                hasContent = true;
                                bubble.innerHTML = renderMarkdown(fullReply);
                                chat.scrollTop = chat.scrollHeight;
                            }
                        } catch(e) {}
                    }
                }
            }
        } catch(e) { console.warn('Stream error:', e); }
        return { fullReply, hasContent };
    }
    
    // ---------- SEND ----------
    async function handleSend() {
        if (isProcessing) return;
        const userText = prompt.value.trim();
        if (!userText && !fileInput.files.length) return;
        isProcessing = true;
        
        let fullText = userText;
        let fileObj = null;
        
        // Commands
        if (fullText && fullText.match(/^\/model\s+/i)) {
            setModelFromChat(fullText);
            prompt.value = '';
            isProcessing = false;
            return;
        }
        if (fullText && fullText.match(/^\/models$/i)) {
            showModelHelp();
            prompt.value = '';
            isProcessing = false;
            return;
        }
        
        if (fileInput.files.length > 0) {
            const f = fileInput.files[0];
            const processed = await processFile(f);
            fileObj = processed;
            if (fullText) fullText += '\n\n[ফাইল: ' + processed.name + ']\n' + processed.content;
            else fullText = '[ফাইল: ' + processed.name + ']\n' + processed.content;
            fileName.textContent = f.name.length > 18 ? f.name.slice(0,16)+'…' : f.name;
            fileInput.value = '';
        }
        
        if (!fullText) { isProcessing = false; return; }
        
        appendMessage('user', fullText);
        prompt.value = '';
        if (!fileInput.files.length) fileName.textContent = '';
        
        // Get relevant memory
        const relevant = vectorSearch(fullText, 4);
        const context = relevant.length > 0 ? relevant.map(m => `${m.role}: ${(m.content||'').substring(0,200)}`).join('\n') : '';
        
        const systemPrompt = `You are Neuron AI, a helpful assistant. Keep responses clear, conversational, and complete. Use Bengali language. Never cut or truncate responses. Provide full answers.`;
        const messages = [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: `[মেমরি]\n${context}\n\nব্যবহারকারী: ${fullText}\n\nউত্তর:` }
        ];
        
        showTyping();
        
        try {
            const canStream = currentAPI === 'ppo' || currentAPI === 'groq' || currentAPI === 'github';
            const modelToUse = currentModel === 'auto' ? 'auto' : currentModel;
            
            if (canStream) {
                const result = await callAPI(messages, modelToUse, true);
                if (result && result.body) {
                    const reader = result.body.getReader();
                    hideTyping();
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'msg agi';
                    const bubble = document.createElement('div');
                    bubble.className = 'bubble';
                    const time = document.createElement('div');
                    time.className = 'time';
                    time.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                    msgDiv.appendChild(bubble);
                    msgDiv.appendChild(time);
                    chat.appendChild(msgDiv);
                    
                    const { fullReply, hasContent } = await processStream(reader, bubble);
                    if (!fullReply || !hasContent) {
                        const fallbackResult = await callAPI(messages, 'auto', false);
                        let text = fallbackResult?.message?.content || fallbackResult?.message?.choices?.[0]?.message?.content || 'দুঃখিত, উত্তর পাচ্ছি না।';
                        if (typeof text === 'object') text = JSON.stringify(text);
                        bubble.innerHTML = renderMarkdown(text);
                    }
                    const entry = { role: 'agi', content: fullReply || 'No response' };
                    memoryStore.push(entry);
                    if (memoryStore.length > 400) memoryStore.shift();
                    updateMemCounter();
                } else {
                    hideTyping();
                    const result = await callAPI(messages, modelToUse, false);
                    let reply = result?.message?.content || result?.message?.choices?.[0]?.message?.content || 'দুঃখিত, উত্তর পাচ্ছি না।';
                    if (typeof reply === 'object') reply = JSON.stringify(reply);
                    appendMessage('agi', reply, result?.model || '');
                }
            } else {
                hideTyping();
                const result = await callAPI(messages, modelToUse, false);
                let reply = result?.message?.content || result?.message?.choices?.[0]?.message?.content || 'দুঃখিত, উত্তর পাচ্ছি না।';
                if (typeof reply === 'object') reply = JSON.stringify(reply);
                appendMessage('agi', reply, result?.model || '');
            }
        } catch(err) {
            hideTyping();
            console.error(err);
            // Auto-fallback
            try {
                const provider = MODEL_CONFIG[currentAPI];
                const fallbacks = provider ? provider.fallback : ['auto'];
                let fallbackReply = null;
                for (const fb of fallbacks) {
                    try {
                        const result = await callAPI(messages, fb, false);
                        const reply = result?.message?.content || result?.message?.choices?.[0]?.message?.content;
                        if (reply) {
                            fallbackReply = reply;
                            appendMessage('agi', reply, '🔄 ' + (result?.model || fb));
                            break;
                        }
                    } catch(e) {}
                }
                if (!fallbackReply) {
                    appendMessage('agi', '⚠️ সংযোগ সমস্যা, আবার চেষ্টা করুন।');
                }
            } catch(e2) {
                appendMessage('agi', '⚠️ সার্ভার সংযোগ সমস্যা।');
            }
        }
        isProcessing = false;
    }

    // ---------- EVENTS ----------
    sendBtn.addEventListener('click', handleSend);
    prompt.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }

    prompt.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 70) + 'px';

    attachBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', function() {

            fileName.textContent = this.files[0].name.length > 22 ? this.files[0].name.slice(0,20)+'…' : this.files[0].name;

    clearBtn.addEventListener('click', () => {
        memoryStore = [];
        updateMemCounter();
        chat.innerHTML = '';
        const welcome = document.createElement('div');
        welcome.className = 'msg agi';
        welcome.innerHTML = `<div class="bubble"><i class="fas fa-robot" style="color:#7bc8d4;margin-right:6px;"></i> 🗑️ মেমরি রিসেট।<br><br>📌 <b>কমান্ড:</b><br><code>/models</code> - মডেল লিস্ট<br><code>/model [নাম]</code> - মডেল পরিবর্তন</div><div class="time">now</div>`;
        chat.appendChild(welcome);
    });
    
    document.getElementById('backBtn').addEventListener('click', () => {
        if (confirm('চ্যাট বন্ধ করবেন?')) {

    // Initial
    updateMemCounter();

    if (currentModel !== 'auto') {

    }
    statusText.textContent = `API: ${currentAPI.toUpperCase()}`;
    console.log('✅ Neuron AI - Fixed message truncation, model change via chat, 4 APIs');
})();
